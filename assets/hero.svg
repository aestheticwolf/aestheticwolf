<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Background Atmospheric Lighting -->
    <radialGradient id="heroVoidGlow" cx="25%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#06070B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="heroCyanFocal" cx="80%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="85%" stop-color="#06070B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="heroCoreOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06070B" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accents & Gradients -->
    <linearGradient id="heroNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <linearGradient id="heroBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="75%" stop-color="#22D3EE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glassLayer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2338" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0D101C" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glassLayer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B2E" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0A0C16" stop-opacity="0.90" />
    </linearGradient>

    <!-- Grid Pattern with Isometric Perspective Feel -->
    <pattern id="heroGridPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.06" />
      <circle cx="36" cy="36" r="0.8" fill="#8B5CF6" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseRadar {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.3); opacity: 0.95; }
      }
      @keyframes scanBeamMove {
        0% { transform: translateY(-420px); opacity: 0; }
        50% { opacity: 0.35; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      @keyframes floatParticlesSlow {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
      }
      @keyframes floatParticlesReverse {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(7px) translateX(-5px); }
      }
      @keyframes ringOrbitClockwise {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ringOrbitCounter {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes floatHud3D {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      /* 5-Phase Rotating Typing Animation (15s cycle: 3s each) */
      @keyframes roleCycle1 {
        0%, 18% { opacity: 1; transform: translateY(0px); }
        20%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes roleCycle2 {
        0%, 19% { opacity: 0; transform: translateY(4px); }
        21%, 38% { opacity: 1; transform: translateY(0px); }
        40%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes roleCycle3 {
        0%, 39% { opacity: 0; transform: translateY(4px); }
        41%, 58% { opacity: 1; transform: translateY(0px); }
        60%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes roleCycle4 {
        0%, 59% { opacity: 0; transform: translateY(4px); }
        61%, 78% { opacity: 1; transform: translateY(0px); }
        80%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes roleCycle5 {
        0%, 79% { opacity: 0; transform: translateY(4px); }
        81%, 98% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-4px); }
      }

      .f-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .f-mono {
        font-family: "JetBrains Mono", "Fira Code", Monaco, Consolas, monospace;
      }
      .cursor-blink {
        animation: blinkCursor 0.85s infinite;
      }
      .pulse-beacon {
        animation: pulseRadar 2.5s infinite ease-in-out;
        transform-origin: center;
      }
      .hud-floating {
        animation: floatHud3D 5s ease-in-out infinite;
      }
      .orbit-cw {
        animation: ringOrbitClockwise 22s linear infinite;
        transform-origin: center;
      }
      .orbit-ccw {
        animation: ringOrbitCounter 28s linear infinite;
        transform-origin: center;
      }
      .particle-layer1 {
        animation: floatParticlesSlow 6s ease-in-out infinite;
      }
      .particle-layer2 {
        animation: floatParticlesReverse 7s ease-in-out infinite;
      }
      .scan-light {
        animation: scanBeamMove 8s ease-in-out infinite;
      }

      .rc-1 { animation: roleCycle1 15s infinite; }
      .rc-2 { animation: roleCycle2 15s infinite; }
      .rc-3 { animation: roleCycle3 15s infinite; }
      .rc-4 { animation: roleCycle4 15s infinite; }
      .rc-5 { animation: roleCycle5 15s infinite; }
    </style>
  </defs>

  <!-- Deep Black Base Canvas -->
  <rect width="1000" height="420" rx="18" fill="#06070B" />

  <!-- Multi-layered Ambient Atmosphere Glows -->
  <rect width="1000" height="420" rx="18" fill="url(#heroVoidGlow)" />
  <rect width="1000" height="420" rx="18" fill="url(#heroCyanFocal)" />
  <rect x="1" y="1" width="998" height="418" rx="17" fill="url(#heroGridPattern)" />

  <!-- Scanning Ambient Light Bar -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#heroBeamGrad)" class="scan-light" />

  <!-- Architectural Outer Border & Neon Top Accent -->
  <rect x="1" y="1" width="998" height="418" rx="17" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <path d="M 50 1 L 950 1" stroke="url(#heroBeamGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1">
    <path d="M 22 28 L 32 28 M 27 23 L 27 33" />
    <path d="M 978 28 L 968 28 M 973 23 L 973 33" />
    <path d="M 22 392 L 32 392 M 27 387 L 27 397" />
    <path d="M 978 392 L 968 392 M 973 387 L 973 397" />
  </g>

  <!-- Floating Ambient Particles -->
  <g class="particle-layer1" fill="#22D3EE" opacity="0.45">
    <circle cx="220" cy="80" r="1.5" />
    <circle cx="480" cy="120" r="1.8" />
    <circle cx="340" cy="340" r="1.2" />
    <circle cx="680" cy="90" r="2" />
  </g>
  <g class="particle-layer2" fill="#8B5CF6" opacity="0.45">
    <circle cx="150" cy="270" r="1.5" />
    <circle cx="590" cy="360" r="1.8" />
    <circle cx="890" cy="140" r="2.2" />
    <circle cx="720" cy="380" r="1.5" />
  </g>

  <!-- TOP STATUS BAR -->
  <g transform="translate(48, 38)">
    <!-- Small Professional Role Indicator -->
    <rect width="210" height="24" rx="12" fill="#101322" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10B981" />
    <circle cx="12" cy="12" r="7" fill="#10B981" class="pulse-beacon" />
    <text x="24" y="15.5" class="f-mono" font-size="9" font-weight="700" fill="#E2E8F0" letter-spacing="1.2">SYSTEM ACTIVE // 2026</text>

    <!-- Geographic & Identity Coordinates -->
    <text x="904" y="16" class="f-mono" font-size="9.5" fill="#64748B" text-anchor="end" letter-spacing="1">
      GOA, IN • 15.29°N 74.12°E • GITHUB: @AESTHETICWOLF
    </text>
  </g>

  <!-- ==================== LEFT SIDE: EDITORIAL IDENTITY ==================== -->
  <g transform="translate(48, 98)">
    <!-- Professional Domain Label -->
    <text x="0" y="22" class="f-mono" font-size="12" font-weight="700" fill="#8B5CF6" letter-spacing="3.5">
      // SOFTWARE ENGINEER • FULL-STACK DEVELOPER
    </text>

    <!-- Large Editorial Typography: RICHARD D'SOUZA -->
    <text x="0" y="80" class="f-sans" font-size="54" font-weight="900" fill="url(#heroNameGrad)" letter-spacing="5">
      RICHARD D'SOUZA
    </text>

    <!-- Animated Typing Engine -->
    <g transform="translate(0, 114)">
      <rect width="28" height="28" rx="6" fill="#121628" stroke="rgba(34, 211, 238, 0.35)" stroke-width="1" />
      <text x="8.5" y="19" class="f-mono" font-size="15" font-weight="800" fill="#22D3EE">&gt;</text>

      <g transform="translate(38, 0)">
        <text x="0" y="20" class="f-mono rc-1" font-size="19" font-weight="700" fill="#38BDF8">Full-Stack Developer</text>
        <text x="0" y="20" class="f-mono rc-2" font-size="19" font-weight="700" fill="#818CF8">Software Engineer</text>
        <text x="0" y="20" class="f-mono rc-3" font-size="19" font-weight="700" fill="#22D3EE">React &amp; React Native Developer</text>
        <text x="0" y="20" class="f-mono rc-4" font-size="19" font-weight="700" fill="#A78BFA">Backend Developer</text>
        <text x="0" y="20" class="f-mono rc-5" font-size="19" font-weight="700" fill="#67E8F9">AI Application Developer</text>

        <!-- Blinking Terminal Cursor -->
        <line x1="330" y1="3" x2="330" y2="23" stroke="#22D3EE" stroke-width="2.5" class="cursor-blink" />
      </g>
    </g>

    <!-- Short Powerful Professional Introduction -->
    <text x="0" y="178" class="f-sans" font-size="15.5" fill="#A1A1AA" letter-spacing="0.2">
      Architecting high-performance web applications, mobile platforms and intelligent software solutions.
    </text>

    <!-- EXACT 3 SMALL INTEGRATED INFORMATION ELEMENTS -->
    <g transform="translate(0, 222)">
      <!-- Indicator 1: Full-Stack Developer -->
      <g transform="translate(0, 0)">
        <rect width="176" height="32" rx="7" fill="#101424" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#8B5CF6" />
        <text x="28" y="20" class="f-mono" font-size="10" font-weight="700" fill="#C4B5FD">Full-Stack Developer</text>
      </g>

      <!-- Indicator 2: M.Sc. Information Technology -->
      <g transform="translate(188, 0)">
        <rect width="210" height="32" rx="7" fill="#101424" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#3B82F6" />
        <text x="28" y="20" class="f-mono" font-size="10" font-weight="700" fill="#93C5FD">M.Sc. Information Tech</text>
      </g>

      <!-- Indicator 3: React • Node • AI -->
      <g transform="translate(410, 0)">
        <rect width="168" height="32" rx="7" fill="#101424" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#22D3EE" />
        <text x="28" y="20" class="f-mono" font-size="10" font-weight="700" fill="#67E8F9">React • Node • AI</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: 3D CYBERNETIC DEVELOPER COMPOSITION ==================== -->
  <g transform="translate(775, 230)" class="hud-floating">
    <!-- Radiant Focal Light & Aura -->
    <circle cx="0" cy="0" r="115" fill="url(#heroCoreOrb)" />

    <!-- LAYER 1: Back Isometric Technical Glass Panel -->
    <g transform="translate(-110, -90)">
      <polygon points="30,0 180,-15 150,90 0,105" fill="url(#glassLayer2)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <line x1="25" y1="25" x2="140" y2="12" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
      <line x1="20" y1="45" x2="135" y2="32" stroke="#3B82F6" stroke-width="1" stroke-dasharray="6 3" opacity="0.4" />
      <text x="35" y="70" class="f-mono" font-size="8" fill="#64748B" transform="rotate(-6)">API: LATENCY 12ms</text>
    </g>

    <!-- LAYER 2: Orbiting Concentric Precision Rings -->
    <g class="orbit-cw">
      <circle cx="0" cy="0" r="92" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="14 18" opacity="0.6" />
      <circle cx="92" cy="0" r="3.5" fill="#8B5CF6" />
      <circle cx="-92" cy="0" r="3.5" fill="#8B5CF6" />
    </g>

    <g class="orbit-ccw">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="8 10" opacity="0.75" />
      <circle cx="0" cy="70" r="3.5" fill="#22D3EE" />
      <circle cx="0" cy="-70" r="3.5" fill="#22D3EE" />
    </g>

    <!-- LAYER 3: Central Polyhedral 3D Geometric Crystal Core -->
    <!-- Exterior Facets with 3D Shading -->
    <polygon points="0,-42 36,-16 36,26 0,52 -36,26 -36,-16" fill="#121628" stroke="#3B82F6" stroke-width="2" />
    <polygon points="0,-42 36,-16 0,0" fill="#22D3EE" fill-opacity="0.15" />
    <polygon points="36,-16 36,26 0,0" fill="#3B82F6" fill-opacity="0.25" />
    <polygon points="36,26 0,52 0,0" fill="#8B5CF6" fill-opacity="0.2" />
    <polygon points="0,52 -36,26 0,0" fill="#1E1B4B" fill-opacity="0.5" />
    <polygon points="-36,26 -36,-16 0,0" fill="#0E1626" fill-opacity="0.6" />
    <polygon points="-36,-16 0,-42 0,0" fill="#22D3EE" fill-opacity="0.2" />

    <!-- Center Monogram Emblem -->
    <circle cx="0" cy="0" r="16" fill="#0A0C16" stroke="#22D3EE" stroke-width="1.5" />
    <text x="0" y="5.5" class="f-mono" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">RD</text>

    <!-- LAYER 4: Floating Front Glass Code Pill -->
    <g transform="translate(-85, 68)">
      <rect width="170" height="32" rx="8" fill="url(#glassLayer1)" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1" />
      <circle cx="14" cy="16" r="3.5" fill="#10B981" />
      <text x="25" y="17" class="f-mono" font-size="8" font-weight="700" fill="#E2E8F0">AI ENGINE: RUNNING</text>
      <text x="25" y="25" class="f-mono" font-size="6.5" fill="#67E8F9">Gemini 2.5 • TypeScript 5.9</text>
    </g>

    <!-- LAYER 5: Floating Top-Right Mini Code Chip -->
    <g transform="translate(42, -92)">
      <rect width="105" height="24" rx="6" fill="#101424" stroke="rgba(139, 92, 246, 0.4)" stroke-width="0.8" />
      <text x="10" y="15" class="f-mono" font-size="8" fill="#C4B5FD">const stack = 2026;</text>
    </g>
  </g>
</svg>