<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowViolet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlowBlue" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlowCyan" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F5F5F7" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121522" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0A0C13" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Dot Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#8B5CF6" fill-opacity="0.12" />
    </pattern>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-360px); }
        100% { transform: translateY(360px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      /* 5-Phase Rotating Typing Animation (15s cycle: 3s each) */
      @keyframes type1 {
        0%, 18% { opacity: 1; transform: translateY(0px); }
        20%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes type2 {
        0%, 19% { opacity: 0; transform: translateY(4px); }
        21%, 38% { opacity: 1; transform: translateY(0px); }
        40%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes type3 {
        0%, 39% { opacity: 0; transform: translateY(4px); }
        41%, 58% { opacity: 1; transform: translateY(0px); }
        60%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes type4 {
        0%, 59% { opacity: 0; transform: translateY(4px); }
        61%, 78% { opacity: 1; transform: translateY(0px); }
        80%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes type5 {
        0%, 79% { opacity: 0; transform: translateY(4px); }
        81%, 98% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-4px); }
      }

      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 5px;
      }
      .text-mono {
        font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, "Courier New", monospace;
      }
      .cursor-blink {
        animation: blink 0.9s infinite;
      }
      .status-pulse {
        animation: pulseGlow 3s infinite ease-in-out;
      }
      .float-badge {
        animation: floatSlow 4s infinite ease-in-out;
      }

      .t-phrase-1 { animation: type1 15s infinite; }
      .t-phrase-2 { animation: type2 15s infinite; }
      .t-phrase-3 { animation: type3 15s infinite; }
      .t-phrase-4 { animation: type4 15s infinite; }
      .t-phrase-5 { animation: type5 15s infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="360" rx="16" fill="#08090D" />

  <!-- Ambient Glows -->
  <rect width="1000" height="360" rx="16" fill="url(#bgGlowViolet)" />
  <rect width="1000" height="360" rx="16" fill="url(#bgGlowBlue)" />
  <rect width="1000" height="360" rx="16" fill="url(#bgGlowCyan)" />

  <!-- Grid & Matrix Patterns -->
  <rect x="1" y="1" width="998" height="358" rx="15" fill="url(#cyberGrid)" />
  <rect x="1" y="1" width="998" height="358" rx="15" fill="url(#dotMatrix)" />

  <!-- Outer Architectural Border -->
  <rect x="1" y="1" width="998" height="358" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <!-- Neon Edge Accent on Top -->
  <path d="M 30 1 L 970 1" stroke="url(#borderGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cybernetic Crosshairs & Technical Corner Markings -->
  <g stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1">
    <path d="M 20 25 L 30 25 M 25 20 L 25 30" />
    <path d="M 980 25 L 970 25 M 975 20 L 975 30" />
    <path d="M 20 335 L 30 335 M 25 330 L 25 340" />
    <path d="M 980 335 L 970 335 M 975 330 L 975 340" />
  </g>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(45, 36)">
    <!-- Status Badge -->
    <rect width="260" height="26" rx="13" fill="#121522" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1" />
    <!-- Glowing Status Indicator Dot -->
    <circle cx="16" cy="13" r="5" fill="#22D3EE" />
    <circle cx="16" cy="13" r="8" fill="#22D3EE" class="status-pulse" />
    <text x="32" y="17" class="text-mono" font-size="10.5" font-weight="700" fill="#22D3EE" letter-spacing="1.5">SYS: ONLINE // 2026 EDITION</text>

    <!-- Version & Protocol Meta -->
    <text x="280" y="17" class="text-mono" font-size="10.5" fill="#A1A1AA" letter-spacing="1">ID: AESTHETICWOLF // v4.2.0</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(45, 105)">
    <!-- Supertitle -->
    <text x="2" y="18" class="text-mono" font-size="13" font-weight="700" fill="#8B5CF6" letter-spacing="3.5">INITIALIZING DIGITAL WORKSPACE // 01</text>

    <!-- Primary Developer Name -->
    <text x="0" y="68" class="text-title" font-size="52" fill="url(#primaryTextGrad)">RICHARD D'SOUZA</text>

    <!-- Dynamic Animated Typing Showcase Container -->
    <g transform="translate(0, 96)">
      <!-- Terminal prompt symbol -->
      <rect x="0" y="0" width="30" height="30" rx="6" fill="#121522" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
      <text x="10" y="20" class="text-mono" font-size="16" font-weight="800" fill="#22D3EE">&gt;</text>

      <!-- Label Box -->
      <g transform="translate(42, 0)">
        <text x="0" y="21" class="text-mono t-phrase-1" font-size="19" font-weight="700" fill="#38BDF8">Software Engineer</text>
        <text x="0" y="21" class="text-mono t-phrase-2" font-size="19" font-weight="700" fill="#818CF8">Full-Stack Developer</text>
        <text x="0" y="21" class="text-mono t-phrase-3" font-size="19" font-weight="700" fill="#22D3EE">React &amp; React Native Developer</text>
        <text x="0" y="21" class="text-mono t-phrase-4" font-size="19" font-weight="700" fill="#A78BFA">Backend Developer</text>
        <text x="0" y="21" class="text-mono t-phrase-5" font-size="19" font-weight="700" fill="#67E8F9">AI Application Developer</text>

        <!-- Blinking Terminal Cursor -->
        <line x1="330" y1="4" x2="330" y2="24" stroke="#22D3EE" stroke-width="2.5" class="cursor-blink" />
      </g>
    </g>

    <!-- Bio Subtitle Line -->
    <text x="2" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#A1A1AA" letter-spacing="0.4">
      Engineering high-performance web applications, mobile architectures &amp; intelligent AI systems.
    </text>
  </g>

  <!-- Right Floating Metric Hub -->
  <g transform="translate(685, 80)" class="float-badge">
    <!-- Outer Card Background -->
    <rect width="270" height="225" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" />
    
    <!-- Header of Metric Hub -->
    <path d="M 0 0 L 270 0" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />
    <rect x="18" y="18" width="8" height="8" rx="2" fill="#8B5CF6" />
    <text x="34" y="26" class="text-mono" font-size="11" font-weight="700" fill="#F5F5F7" letter-spacing="1.5">METRICS &amp; TELEMETRY</text>

    <!-- Metric 1: Location -->
    <g transform="translate(18, 48)">
      <rect width="234" height="42" rx="8" fill="#0D0F18" stroke="rgba(255,255,255,0.05)" />
      <text x="14" y="19" class="text-mono" font-size="9" fill="#A1A1AA" letter-spacing="1">LOCATION</text>
      <text x="14" y="34" class="text-mono" font-size="12" font-weight="700" fill="#22D3EE">Goa, India (IST)</text>
      <circle cx="215" cy="21" r="4" fill="#22D3EE" opacity="0.8" />
    </g>

    <!-- Metric 2: Education -->
    <g transform="translate(18, 98)">
      <rect width="234" height="42" rx="8" fill="#0D0F18" stroke="rgba(255,255,255,0.05)" />
      <text x="14" y="19" class="text-mono" font-size="9" fill="#A1A1AA" letter-spacing="1">EDUCATION</text>
      <text x="14" y="34" class="text-mono" font-size="12" font-weight="700" fill="#A78BFA">M.Sc. Information Tech</text>
      <circle cx="215" cy="21" r="4" fill="#8B5CF6" opacity="0.8" />
    </g>

    <!-- Metric 3: Focus Core -->
    <g transform="translate(18, 148)">
      <rect width="234" height="46" rx="8" fill="#0D0F18" stroke="rgba(255,255,255,0.05)" />
      <text x="14" y="19" class="text-mono" font-size="9" fill="#A1A1AA" letter-spacing="1">PRIMARY FOCUS</text>
      <text x="14" y="36" class="text-mono" font-size="11.5" font-weight="700" fill="#38BDF8">Full-Stack • Mobile • AI</text>
      <circle cx="215" cy="23" r="4" fill="#3B82F6" opacity="0.8" />
    </g>
  </g>

  <!-- Bottom Accent Status Line -->
  <g transform="translate(45, 335)">
    <circle cx="4" cy="4" r="3" fill="#8B5CF6" />
    <text x="16" y="8" class="text-mono" font-size="10" fill="#A1A1AA" letter-spacing="1">PARVATIBAI CHOWGULE COLLEGE OF ARTS &amp; SCIENCE</text>
    <path d="M 370 4 L 620 4" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3 3" />
    <text x="635" y="8" class="text-mono" font-size="10" fill="#22D3EE" letter-spacing="1.5">⚡ READY TO DEPLOY</text>
  </g>
</svg>