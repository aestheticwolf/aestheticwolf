<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="hGlowViolet" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hGlowBlue" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hCompassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="hTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <linearGradient id="hBorderLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="hGlassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141828" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0C0E18" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="hSubtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseLive {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      @keyframes ringRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ringRotateRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      /* 5-Phase Rotating Typing Animation (15s cycle: 3s each) */
      @keyframes type1 {
        0%, 18% { opacity: 1; transform: translateY(0px); }
        20%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes type2 {
        0%, 19% { opacity: 0; transform: translateY(3px); }
        21%, 38% { opacity: 1; transform: translateY(0px); }
        40%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes type3 {
        0%, 39% { opacity: 0; transform: translateY(3px); }
        41%, 58% { opacity: 1; transform: translateY(0px); }
        60%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes type4 {
        0%, 59% { opacity: 0; transform: translateY(3px); }
        61%, 78% { opacity: 1; transform: translateY(0px); }
        80%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      @keyframes type5 {
        0%, 79% { opacity: 0; transform: translateY(3px); }
        81%, 98% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-3px); }
      }

      .f-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .f-mono {
        font-family: "JetBrains Mono", "Fira Code", Monaco, Consolas, monospace;
      }
      .cursor-b {
        animation: blinkCursor 0.85s infinite;
      }
      .pulse-dot {
        animation: pulseLive 2.5s infinite ease-in-out;
        transform-origin: center;
      }
      .ring-slow {
        animation: ringRotate 24s linear infinite;
        transform-origin: center;
      }
      .ring-slow-rev {
        animation: ringRotateRev 30s linear infinite;
        transform-origin: center;
      }
      .hud-float {
        animation: floatCard 4s ease-in-out infinite;
      }

      .tp-1 { animation: type1 15s infinite; }
      .tp-2 { animation: type2 15s infinite; }
      .tp-3 { animation: type3 15s infinite; }
      .tp-4 { animation: type4 15s infinite; }
      .tp-5 { animation: type5 15s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="380" rx="16" fill="#08090D" />
  <rect width="1000" height="380" rx="16" fill="url(#hGlowViolet)" />
  <rect width="1000" height="380" rx="16" fill="url(#hGlowBlue)" />
  <rect x="1" y="1" width="998" height="378" rx="15" fill="url(#hSubtleGrid)" />

  <!-- Architecture Outer Rim -->
  <rect x="1" y="1" width="998" height="378" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <!-- Neon Edge Highlight -->
  <path d="M 40 1 L 960 1" stroke="url(#hBorderLine)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top System Header Bar -->
  <g transform="translate(45, 34)">
    <!-- Status Radar Pill -->
    <rect width="252" height="24" rx="12" fill="#121524" stroke="rgba(34, 211, 238, 0.25)" stroke-width="1" />
    <circle cx="14" cy="12" r="4.5" fill="#22D3EE" />
    <circle cx="14" cy="12" r="7.5" fill="#22D3EE" class="pulse-dot" />
    <text x="28" y="16" class="f-mono" font-size="9.5" font-weight="700" fill="#22D3EE" letter-spacing="1.5">SYS: ONLINE // 2026 EDITION</text>

    <!-- Geographic Coordinates & Telemetry -->
    <text x="910" y="16" class="f-mono" font-size="10" fill="#64748B" text-anchor="end" letter-spacing="1">GOA, INDIA (15.29° N, 74.12° E) • @AESTHETICWOLF</text>
  </g>

  <!-- LEFT COLUMN: MAIN EDITORIAL IDENTITY -->
  <g transform="translate(45, 96)">
    <!-- Label -->
    <text x="0" y="20" class="f-mono" font-size="12" font-weight="700" fill="#8B5CF6" letter-spacing="3.5">
      // SOFTWARE ENGINEER &amp; FULL-STACK DEVELOPER
    </text>

    <!-- Primary Developer Name -->
    <text x="0" y="74" class="f-sans" font-size="52" font-weight="900" fill="url(#hTitleGrad)" letter-spacing="5">
      RICHARD D'SOUZA
    </text>

    <!-- Dynamic Typing Engine Container -->
    <g transform="translate(0, 106)">
      <rect width="28" height="28" rx="6" fill="#121524" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
      <text x="9" y="19" class="f-mono" font-size="16" font-weight="800" fill="#22D3EE">&gt;</text>

      <g transform="translate(38, 0)">
        <text x="0" y="20" class="f-mono tp-1" font-size="19" font-weight="700" fill="#38BDF8">Software Engineer</text>
        <text x="0" y="20" class="f-mono tp-2" font-size="19" font-weight="700" fill="#818CF8">Full-Stack Developer</text>
        <text x="0" y="20" class="f-mono tp-3" font-size="19" font-weight="700" fill="#22D3EE">React &amp; React Native Developer</text>
        <text x="0" y="20" class="f-mono tp-4" font-size="19" font-weight="700" fill="#A78BFA">Backend Developer</text>
        <text x="0" y="20" class="f-mono tp-5" font-size="19" font-weight="700" fill="#67E8F9">AI Application Developer</text>

        <!-- Blinking Terminal Cursor -->
        <line x1="330" y1="3" x2="330" y2="23" stroke="#22D3EE" stroke-width="2.5" class="cursor-b" />
      </g>
    </g>

    <!-- Concise Editorial Manifesto -->
    <text x="0" y="168" class="f-sans" font-size="15" fill="#A1A1AA" letter-spacing="0.3">
      Architecting high-performance web applications, mobile platforms &amp; applied intelligence systems.
    </text>

    <!-- Quick Glass Telemetry Pills -->
    <g transform="translate(0, 204)">
      <!-- Pill 1: Alum -->
      <rect width="180" height="30" rx="6" fill="#121524" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="14" cy="15" r="3.5" fill="#8B5CF6" />
      <text x="26" y="19" class="f-mono" font-size="10" font-weight="600" fill="#C4B5FD">Infipre &amp; Onstro Alum</text>

      <!-- Pill 2: Education -->
      <g transform="translate(192, 0)">
        <rect width="200" height="30" rx="6" fill="#121524" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <circle cx="14" cy="15" r="3.5" fill="#3B82F6" />
        <text x="26" y="19" class="f-mono" font-size="10" font-weight="600" fill="#93C5FD">M.Sc. Information Tech</text>
      </g>

      <!-- Pill 3: Flagship -->
      <g transform="translate(404, 0)">
        <rect width="170" height="30" rx="6" fill="#121524" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <circle cx="14" cy="15" r="3.5" fill="#22D3EE" />
        <text x="26" y="19" class="f-mono" font-size="10" font-weight="600" fill="#67E8F9">React • Node • AI</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: 3D CYBERNETIC WORKSPACE EMBLEM -->
  <g transform="translate(790, 205)" class="hud-float">
    <!-- Ambient Radial Core -->
    <circle cx="0" cy="0" r="110" fill="url(#hCompassGlow)" />

    <!-- Outer Tech Orbit Ring -->
    <g class="ring-slow">
      <circle cx="0" cy="0" r="82" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="10 14" opacity="0.6" />
      <circle cx="82" cy="0" r="3" fill="#8B5CF6" />
      <circle cx="-82" cy="0" r="3" fill="#8B5CF6" />
    </g>

    <!-- Inner Reversed Tech Orbit Ring -->
    <g class="ring-slow-rev">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.75" />
      <circle cx="0" cy="62" r="3" fill="#22D3EE" />
      <circle cx="0" cy="-62" r="3" fill="#22D3EE" />
    </g>

    <!-- Central Polyhedral Core -->
    <polygon points="0,-36 32,-14 32,22 0,44 -32,22 -32,-14" fill="#101322" stroke="#3B82F6" stroke-width="1.8" />
    <polygon points="0,-22 20,-8 20,14 0,26 -20,14 -20,-8" fill="#151A2C" stroke="#22D3EE" stroke-width="1.2" />

    <!-- Core Rune Monogram -->
    <text x="0" y="6" class="f-mono" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">RD</text>

    <!-- Mini Telemetry Pill Floating Below Core -->
    <g transform="translate(-65, 78)">
      <rect width="130" height="24" rx="12" fill="url(#hGlassCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#10B981" />
      <text x="24" y="16" class="f-mono" font-size="9" font-weight="700" fill="#E2E8F0" letter-spacing="1">STATUS: READY</text>
    </g>
  </g>
</svg>