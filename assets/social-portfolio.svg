<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" width="100%">
  <defs>
    <linearGradient id="cardBg_portfolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A29" />
      <stop offset="100%" stop-color="#0E121E" />
    </linearGradient>

    <linearGradient id="borderGrad_portfolio" x1="0%" y1="0%" x2="100%" y2="0%">
      
          <stop offset="0%" stop-color="#282E44" />
          <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#282E44" />
        
    </linearGradient>

    <filter id="iconGlow_portfolio" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  ]]></style>

  <!-- Card Chassis -->
  <rect width="310" height="88" rx="12" fill="url(#cardBg_portfolio)" stroke="url(#borderGrad_portfolio)" stroke-width="1.3" />

  <!-- Left Icon Box -->
  <g transform="translate(16, 18)">
    <rect width="52" height="52" rx="10" fill="#0D111C" stroke="#222B3F" stroke-width="1" />
    <g transform="translate(10, 10) scale(1)">
      
          <!-- Portfolio Globe / Spark Mark -->
          <circle cx="16" cy="16" r="14" fill="none" stroke="#34D399" stroke-width="2.2" />
          <path fill="none" stroke="#34D399" stroke-width="1.8" d="M2 16h28M16 2a22 22 0 0 1 0 28M16 2a22 22 0 0 0 0 28" />
        
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(78, 28)">
    <!-- Metadata Pill -->
    <rect x="0" y="0" width="138" height="15" rx="4" fill="#142E28" />
    <text x="6" y="11" class="mono" font-size="8.5" font-weight="700" fill="#34D399" letter-spacing="0.5">LIVE PORTFOLIO 2026</text>

    <!-- Network / Username -->
    <text x="0" y="32" class="sans" font-size="14.5" font-weight="700" fill="#FFFFFF">Live Portfolio</text>
    <text x="0" y="47" class="mono" font-size="10.5" font-weight="500" fill="#8B949E">richard-portfolio.vercel.app</text>
  </g>

  <!-- Right Arrow Indicator -->
  <g transform="translate(280, 44)">
    <circle cx="0" cy="0" r="11" fill="#182032" stroke="#2B364E" stroke-width="1" />
    <path d="M -3 -4 L 2 0 L -3 4" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
