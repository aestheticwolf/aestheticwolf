<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" width="100%" height="100%">
  <defs>
    <linearGradient id="border_Live Portfolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#10B981;#A78BFA;#10B981" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#282E44" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121726" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0.98" />
    </linearGradient>

    <filter id="glow_Live Portfolio" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style><![CDATA[
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card-box:hover {
      cursor: pointer;
    }
  ]]></style>

  <!-- Card Chassis -->
  <g filter="url(#glow_Live Portfolio)">
    <rect x="2" y="2" width="306" height="84" rx="13" fill="url(#cardBg)" stroke="url(#border_Live Portfolio)" stroke-width="1.3" />
  </g>

  <!-- Icon Circle Badge -->
  <g transform="translate(18, 18)">
    <circle cx="24" cy="24" r="23" fill="#161C2C" stroke="#283550" stroke-width="1" />
    <g transform="translate(12, 12)">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="#10B981"/>
    </g>
  </g>

  <!-- Platform Information -->
  <g transform="translate(76, 26)">
    <text x="0" y="14" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">Live Portfolio</text>
    <text x="0" y="32" class="mono" font-size="11" font-weight="600" fill="#10B981">richard-portfolio</text>
    <text x="0" y="47" class="sans" font-size="9.5" fill="#71717A">Interactive Web Projects</text>
  </g>

  <!-- External Link Indicator Pill -->
  <g transform="translate(242, 18)">
    <rect x="0" y="0" width="50" height="22" rx="11" fill="#141B2B" stroke="#10B981" stroke-width="0.8" />
    <text x="21" y="14" class="sans" font-size="9.5" font-weight="700" fill="#10B981">GO</text>
    <text x="35" y="14" class="sans" font-size="11" font-weight="700" fill="#10B981">↗</text>
  </g>
</svg>
