<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121524" />
      <stop offset="100%" stop-color="#090B13" />
    </linearGradient>
    <linearGradient id="crmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="crmGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090B13" stop-opacity="0" />
    </radialGradient>
    <style>
      .f-code { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .f-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect width="500" height="320" rx="12" fill="url(#crmBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect width="500" height="320" rx="12" fill="url(#crmGlow)" />
  <path d="M 0 0 L 500 0" stroke="url(#crmAccent)" stroke-width="2.5" rx="1" />

  <!-- Window Header -->
  <rect x="0" y="0" width="500" height="32" rx="12" fill="#15192C" />
  <circle cx="20" cy="16" r="4.5" fill="#EF4444" />
  <circle cx="34" cy="16" r="4.5" fill="#F59E0B" />
  <circle cx="48" cy="16" r="4.5" fill="#10B981" />
  <text x="70" y="20" class="f-code" font-size="9.5" fill="#94A3B8">crm.intelligence.internal • Gemini RAG Active</text>

  <!-- Metric Widget 1: Total Accounts -->
  <g transform="translate(24, 48)">
    <rect width="138" height="64" rx="8" fill="#0C0E1A" stroke="rgba(255,255,255,0.05)" />
    <text x="14" y="22" class="f-code" font-size="8.5" fill="#A1A1AA">ACTIVE CLIENTS</text>
    <text x="14" y="46" class="f-ui" font-size="18" font-weight="800" fill="#F5F5F7">1,420</text>
    <text x="80" y="46" class="f-code" font-size="9" fill="#10B981">+18.4%</text>
  </g>

  <!-- Metric Widget 2: Sync Telemetry -->
  <g transform="translate(180, 48)">
    <rect width="138" height="64" rx="8" fill="#0C0E1A" stroke="rgba(255,255,255,0.05)" />
    <text x="14" y="22" class="f-code" font-size="8.5" fill="#A1A1AA">ORDERS SYNCED</text>
    <text x="14" y="46" class="f-ui" font-size="18" font-weight="800" fill="#67E8F9">8,950</text>
    <text x="82" y="46" class="f-code" font-size="9" fill="#3B82F6">Live</text>
  </g>

  <!-- Metric Widget 3: AI Sentiment -->
  <g transform="translate(336, 48)">
    <rect width="138" height="64" rx="8" fill="#0C0E1A" stroke="rgba(255,255,255,0.05)" />
    <text x="14" y="22" class="f-code" font-size="8.5" fill="#A1A1AA">AI SENTIMENT</text>
    <text x="14" y="46" class="f-ui" font-size="16" font-weight="800" fill="#C4B5FD">98.2% Pos</text>
  </g>

  <!-- Main Central Visual: AI Customer Summary & Trend Graph -->
  <g transform="translate(24, 126)">
    <!-- Summary Container -->
    <rect width="452" height="124" rx="8" fill="#0E111E" stroke="rgba(139,92,246,0.25)" stroke-width="1" />
    
    <!-- Gemini AI Badge -->
    <rect x="16" y="14" width="130" height="20" rx="4" fill="#1A1C30" />
    <circle cx="26" cy="24" r="3" fill="#8B5CF6" />
    <text x="36" y="27" class="f-code" font-size="8" font-weight="700" fill="#C4B5FD">GOOGLE GEMINI 2.5</text>

    <text x="16" y="52" class="f-ui" font-size="12" font-weight="700" fill="#FFFFFF">Executive Account Brief: Enterprise Logistics Q2</text>
    <text x="16" y="70" class="f-ui" font-size="10.5" fill="#94A3B8">High retention probability. 42 orders fulfilled with zero refund friction.</text>
    <text x="16" y="86" class="f-ui" font-size="10.5" fill="#94A3B8">Recommended action: Trigger automated recurring subscription renewal.</text>

    <!-- Mini Chart Vector -->
    <g transform="translate(320, 30)">
      <path d="M 0 50 L 25 35 L 50 42 L 75 15 L 100 22 L 120 5" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
      <circle cx="120" cy="5" r="3.5" fill="#22D3EE" />
      <path d="M 0 50 L 25 35 L 50 42 L 75 15 L 100 22 L 120 5 L 120 60 L 0 60 Z" fill="#22D3EE" opacity="0.08" />
    </g>

    <!-- Tags -->
    <g transform="translate(16, 96)">
      <rect width="60" height="18" rx="3" fill="#181D32" />
      <text x="8" y="12" class="f-code" font-size="8" fill="#38BDF8">JWT: OK</text>
      <rect x="68" y="0" width="85" height="18" rx="3" fill="#181D32" />
      <text x="76" y="12" class="f-code" font-size="8" fill="#A78BFA">PRISMA ORM</text>
      <rect x="160" y="0" width="92" height="18" rx="3" fill="#181D32" />
      <text x="168" y="12" class="f-code" font-size="8" fill="#34D399">WOOCOMMERCE</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 268)">
    <text x="0" y="24" class="f-code" font-size="9" fill="#64748B">ARCHITECTURE: REACT 19 • EXPRESS • SQLITE • PRISMA • GEMINI</text>
    <text x="452" y="24" class="f-code" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="end">READY TO RUN →</text>
  </g>
</svg>