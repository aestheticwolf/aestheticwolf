<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" width="100%">
  <defs>
    <linearGradient id="cardBg_linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A29" />
      <stop offset="100%" stop-color="#0E121E" />
    </linearGradient>

    <linearGradient id="borderGrad_linkedin" x1="0%" y1="0%" x2="100%" y2="0%">
      
          <stop offset="0%" stop-color="#282E44" />
          <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#282E44" />
        
    </linearGradient>

    <filter id="iconGlow_linkedin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  ]]></style>

  <!-- Card Chassis -->
  <rect width="310" height="88" rx="12" fill="url(#cardBg_linkedin)" stroke="url(#borderGrad_linkedin)" stroke-width="1.3" />

  <!-- Left Icon Box -->
  <g transform="translate(16, 18)">
    <rect width="52" height="52" rx="10" fill="#0D111C" stroke="#222B3F" stroke-width="1" />
    <g transform="translate(10, 10) scale(1)">
      
          <!-- LinkedIn In Mark -->
          <path fill="#60A5FA" d="M29.6 0H2.4C1.1 0 0 1.1 0 2.4v27.2C0 30.9 1.1 32 2.4 32h27.2c1.3 0 2.4-1.1 2.4-2.4V2.4C32 1.1 30.9 0 29.6 0zM9.5 27.3H4.8V12h4.7v15.3zM7.2 9.9c-1.5 0-2.8-1.2-2.8-2.8 0-1.5 1.2-2.8 2.8-2.8 1.5 0 2.8 1.2 2.8 2.8 0 1.6-1.3 2.8-2.8 2.8zm20.1 17.4h-4.7v-7.4c0-1.8 0-4-2.5-4s-2.8 1.9-2.8 3.9v7.5h-4.7V12h4.5v2.1h.1c.6-1.2 2.2-2.5 4.5-2.5 4.8 0 5.7 3.2 5.7 7.3v8.4z" />
        
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(78, 28)">
    <!-- Metadata Pill -->
    <rect x="0" y="0" width="138" height="15" rx="4" fill="#182442" />
    <text x="6" y="11" class="mono" font-size="8.5" font-weight="700" fill="#60A5FA" letter-spacing="0.5">PROFESSIONAL NETWORK</text>

    <!-- Network / Username -->
    <text x="0" y="32" class="sans" font-size="14.5" font-weight="700" fill="#FFFFFF">LinkedIn</text>
    <text x="0" y="47" class="mono" font-size="10.5" font-weight="500" fill="#8B949E">in/richarddsouza29</text>
  </g>

  <!-- Right Arrow Indicator -->
  <g transform="translate(280, 44)">
    <circle cx="0" cy="0" r="11" fill="#182032" stroke="#2B364E" stroke-width="1" />
    <path d="M -3 -4 L 2 0 L -3 4" fill="none" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
