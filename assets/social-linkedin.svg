<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" width="100%" height="100%">
  <defs>
    <linearGradient id="border_LinkedIn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#60A5FA;#A78BFA;#60A5FA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#282E44" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121726" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0.98" />
    </linearGradient>

    <filter id="glow_LinkedIn" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style><![CDATA[
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card-box:hover {
      cursor: pointer;
    }
  ]]></style>

  <!-- Card Chassis -->
  <g filter="url(#glow_LinkedIn)">
    <rect x="2" y="2" width="306" height="84" rx="13" fill="url(#cardBg)" stroke="url(#border_LinkedIn)" stroke-width="1.3" />
  </g>

  <!-- Icon Circle Badge -->
  <g transform="translate(18, 18)">
    <circle cx="24" cy="24" r="23" fill="#161C2C" stroke="#283550" stroke-width="1" />
    <g transform="translate(12, 12)">
      <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" fill="#0A66C2"/>
    </g>
  </g>

  <!-- Platform Information -->
  <g transform="translate(76, 26)">
    <text x="0" y="14" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">LinkedIn</text>
    <text x="0" y="32" class="mono" font-size="11" font-weight="600" fill="#60A5FA">in/richarddsouza29</text>
    <text x="0" y="47" class="sans" font-size="9.5" fill="#71717A">Professional Network</text>
  </g>

  <!-- External Link Indicator Pill -->
  <g transform="translate(242, 18)">
    <rect x="0" y="0" width="50" height="22" rx="11" fill="#141B2B" stroke="#60A5FA" stroke-width="0.8" />
    <text x="21" y="14" class="sans" font-size="9.5" font-weight="700" fill="#60A5FA">GO</text>
    <text x="35" y="14" class="sans" font-size="11" font-weight="700" fill="#60A5FA">↗</text>
  </g>
</svg>
