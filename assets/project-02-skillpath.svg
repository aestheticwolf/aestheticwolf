<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#080A12" />
    </linearGradient>
    <linearGradient id="spAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="spGlow" cx="60%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080A12" stop-opacity="0" />
    </radialGradient>
    <style>
      .f-code { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .f-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#spBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect width="500" height="320" rx="12" fill="url(#spGlow)" />
  <path d="M 0 0 L 500 0" stroke="url(#spAccent)" stroke-width="2.5" rx="1" />

  <!-- Window Header -->
  <rect x="0" y="0" width="500" height="32" rx="12" fill="#151A2E" />
  <circle cx="20" cy="16" r="4.5" fill="#EF4444" />
  <circle cx="34" cy="16" r="4.5" fill="#F59E0B" />
  <circle cx="48" cy="16" r="4.5" fill="#10B981" />
  <text x="70" y="20" class="f-code" font-size="9.5" fill="#94A3B8">SkillPath Native • iOS &amp; Android Engine (Expo)</text>

  <!-- Mobile Screen Mockup Card Left -->
  <g transform="translate(24, 48)">
    <rect width="180" height="210" rx="14" fill="#0C0E1A" stroke="rgba(59,130,246,0.3)" stroke-width="1" />
    <!-- Phone Top Speaker Bar -->
    <rect x="65" y="8" width="50" height="3.5" rx="1.5" fill="#22283C" />
    
    <!-- App Header Inside Phone -->
    <text x="14" y="32" class="f-ui" font-size="11" font-weight="800" fill="#FFFFFF">Daily Learning</text>
    <text x="14" y="44" class="f-code" font-size="7.5" fill="#22D3EE">24 DAY STREAK 🔥</text>

    <!-- Task Item 1 -->
    <g transform="translate(10, 54)">
      <rect width="160" height="32" rx="6" fill="#14182B" />
      <circle cx="16" cy="16" r="5" fill="#10B981" />
      <text x="28" y="16" class="f-ui" font-size="8.5" font-weight="700" fill="#F1F5F9">Distributed Systems</text>
      <text x="28" y="25" class="f-code" font-size="6.5" fill="#94A3B8">Module 4 completed</text>
    </g>

    <!-- Task Item 2 -->
    <g transform="translate(10, 92)">
      <rect width="160" height="32" rx="6" fill="#14182B" />
      <circle cx="16" cy="16" r="5" fill="#3B82F6" />
      <text x="28" y="16" class="f-ui" font-size="8.5" font-weight="700" fill="#F1F5F9">React Native Reanimated</text>
      <text x="28" y="25" class="f-code" font-size="6.5" fill="#67E8F9">Gesture handler task</text>
    </g>

    <!-- Task Item 3 -->
    <g transform="translate(10, 130)">
      <rect width="160" height="32" rx="6" fill="#14182B" />
      <circle cx="16" cy="16" r="5" fill="#8B5CF6" />
      <text x="28" y="16" class="f-ui" font-size="8.5" font-weight="700" fill="#F1F5F9">Firebase Realtime Sync</text>
      <text x="28" y="25" class="f-code" font-size="6.5" fill="#A78BFA">Cloud schema update</text>
    </g>

    <!-- Progress Indicator inside phone -->
    <g transform="translate(14, 180)">
      <text x="0" y="0" class="f-code" font-size="7" fill="#A1A1AA">WEEKLY COMPLETION: 85%</text>
      <rect x="0" y="5" width="152" height="4" rx="2" fill="#181D30" />
      <rect x="0" y="5" width="129" height="4" rx="2" fill="#22D3EE" />
    </g>
  </g>

  <!-- Right Details & Architecture Breakdown -->
  <g transform="translate(222, 54)">
    <text x="0" y="18" class="f-code" font-size="9" font-weight="700" fill="#22D3EE">ARCHITECTURE CORE</text>
    <text x="0" y="40" class="f-ui" font-size="14" font-weight="800" fill="#FFFFFF">Cross-Platform Productivity Hub</text>
    <text x="0" y="60" class="f-ui" font-size="10.5" fill="#94A3B8">Engineered for students &amp; engineers to break large</text>
    <text x="0" y="76" class="f-ui" font-size="10.5" fill="#94A3B8">curricula into bite-sized actionable milestones.</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 96)">
      <rect width="120" height="22" rx="4" fill="#12162A" stroke="rgba(59,130,246,0.3)" />
      <text x="10" y="15" class="f-code" font-size="8" fill="#93C5FD">FIREBASE CLOUD</text>

      <rect x="128" y="0" width="120" height="22" rx="4" fill="#12162A" stroke="rgba(34,211,238,0.3)" />
      <text x="138" y="15" class="f-code" font-size="8" fill="#67E8F9">PUSH ALERTS</text>

      <g transform="translate(0, 30)">
        <rect width="135" height="22" rx="4" fill="#12162A" stroke="rgba(139,92,246,0.3)" />
        <text x="10" y="15" class="f-code" font-size="8" fill="#C4B5FD">OFFLINE CACHING</text>
        <rect x="143" y="0" width="105" height="22" rx="4" fill="#12162A" stroke="rgba(16,185,129,0.3)" />
        <text x="153" y="15" class="f-code" font-size="8" fill="#10B981">EXPO ROUTER</text>
      </g>
    </g>

    <!-- Telemetry status -->
    <g transform="translate(0, 164)">
      <circle cx="6" cy="6" r="3" fill="#10B981" />
      <text x="16" y="9" class="f-code" font-size="8.5" fill="#E2E8F0">Active State Hydration: 0ms Latency</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 274)">
    <text x="0" y="24" class="f-code" font-size="9" fill="#64748B">STACK: REACT NATIVE • EXPO • TYPESCRIPT • FIREBASE CLOUD</text>
    <text x="452" y="24" class="f-code" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">VIEW REPO →</text>
  </g>
</svg>