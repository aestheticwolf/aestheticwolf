        <text x="0" y="52" fill="#A78BFA">$ node server.js</text>
        <text x="0" y="67" fill="#22D3EE">⚡ Port 8080 online</text>
        <text x="0" y="82" fill="#E2E8F0">● DB: SQLite &amp; Atlas</text>
        <text x="0" y="97" fill="#34D399">● Auth: JWT Verified</text>
      </g>

