      <rect width="30" height="382" fill="#0A0C14" />
      <path d="M 30 0 L 30 382" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />

      <g class="t-mono" font-size="10" fill="#334155" text-anchor="end">
        <text x="22" y="22">1</text>
        <text x="22" y="42">2</text>
        <text x="22" y="62">3</text>
        <text x="22" y="82">4</text>
        <text x="22" y="102">5</text>
        <text x="22" y="122">6</text>
        <text x="22" y="142">7</text>
        <text x="22" y="162">8</text>
        <text x="22" y="182">9</text>
        <text x="22" y="202">10</text>
        <text x="22" y="222">11</text>
        <text x="22" y="242">12</text>
        <text x="22" y="262">13</text>
        <text x="22" y="282">14</text>
