  <!-- Center Thumb Opening Recess -->
  <rect x="465" y="528" width="70" height="4" rx="2" fill="#0C0E16" stroke="#2B3145" stroke-width="0.5" />

  <!-- Ambient Underglow Leak between Lid & Deck -->
  <path d="M 160 528 L 840 528" stroke="url(#lapTabActive)" stroke-width="2" opacity="0.8" />
</svg>