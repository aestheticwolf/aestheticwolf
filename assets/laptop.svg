  <!-- Lower Laptop Deck in Perspective -->
  <path d="M 40 528 L 960 528 L 890 558 L 110 558 Z" fill="url(#lapDeckGrad)" stroke="#32384E" stroke-width="1.2" />

  <!-- Front Deck Lip Highlight -->
