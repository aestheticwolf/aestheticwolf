        <text x="0" y="0" class="text-code" font-size="9.5" fill="#94A3B8">▾ src</text>
        <text x="10" y="18" class="text-code" font-size="9.5" fill="#64748B">▸ api</text>
        <text x="10" y="34" class="text-code" font-size="9.5" fill="#64748B">▸ components</text>
        
        <text x="10" y="52" class="text-code" font-size="9.5" fill="#94A3B8">▾ intelligence</text>
        <text x="22" y="68" class="text-code" font-size="9.5" fill="#22D3EE">• gemini.ts</text>
        <text x="22" y="84" class="text-code" font-size="9.5" fill="#A78BFA">• agent.ts</text>
        
        <text x="10" y="102" class="text-code" font-size="9.5" fill="#94A3B8">▾ database</text>
        <text x="22" y="118" class="text-code" font-size="9.5" fill="#38BDF8">• prisma.db</text>

        <text x="10" y="136" class="text-code" font-size="9.5" fill="#F472B6">⚛ App.tsx</text>
        <text x="10" y="152" class="text-code" font-size="9.5" fill="#F59E0B">⚡ vite.config.ts</text>
        <text x="10" y="168" class="text-code" font-size="9.5" fill="#64748B">⚙ package.json</text>
      </g>
    </g>

    <!-- CENTER CODE EDITOR PANE -->
    <g transform="translate(140, 62)">
      <!-- Line Number Gutter -->
      <rect width="32" height="366" fill="#0A0C14" />
      <path d="M 32 0 L 32 366" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      
      <g class="text-code" font-size="10.5" fill="#334155" text-anchor="end">
        <text x="24" y="24">1</text>
        <text x="24" y="44">2</text>
        <text x="24" y="64">3</text>
        <text x="24" y="84">4</text>
        <text x="24" y="104">5</text>
        <text x="24" y="124">6</text>
        <text x="24" y="144">7</text>
        <text x="24" y="164">8</text>
        <text x="24" y="184">9</text>
        <text x="24" y="204">10</text>
        <text x="24" y="224">11</text>
        <text x="24" y="244">12</text>
        <text x="24" y="264">13</text>
        <text x="24" y="284">14</text>
        <text x="24" y="304">15</text>
        <text x="24" y="324">16</text>
      </g>

      <!-- Active Line Highlight on Line 8 -->
      <rect x="33" y="150" width="357" height="20" fill="#141829" opacity="0.8" />
      <path d="M 33 150 L 33 170" stroke="#8B5CF6" stroke-width="2" />

      <!-- Syntax-Highlighted Code -->
      <g transform="translate(44, 0)" class="text-code" font-size="10.5">
        <!-- Line 1 -->
        <text x="0" y="24">
          <tspan fill="#F43F5E">import</tspan> <tspan fill="#F8FAFC">{ GoogleGemini, RAG }</tspan> <tspan fill="#F43F5E">from</tspan> <tspan fill="#34D399">'@ai/core'</tspan><tspan fill="#F8FAFC">;</tspan>
        </text>

        <!-- Line 2 -->
        <text x="0" y="44">
          <tspan fill="#F43F5E">import</tspan> <tspan fill="#F8FAFC">{ PrismaClient }</tspan> <tspan fill="#F43F5E">from</tspan> <tspan fill="#34D399">'@prisma/client'</tspan><tspan fill="#F8FAFC">;</tspan>
        </text>

        <!-- Line 3 (Comment) -->
        <text x="0" y="64" fill="#64748B">
          // Architect: Richard D'Souza (Full-Stack Engineer)
        </text>

        <!-- Line 4 -->
        <text x="0" y="84">
          <tspan fill="#818CF8">export async function</tspan> <tspan fill="#38BDF8">orchestrateSystem</tspan><tspan fill="#F8FAFC">(req: DevRequest) {</tspan>
        </text>

        <!-- Line 5 -->
        <text x="12" y="104">
          <tspan fill="#F43F5E">const</tspan> <tspan fill="#F8FAFC">ai</tspan> <tspan fill="#F43F5E">=</tspan> <tspan fill="#818CF8">new</tspan> <tspan fill="#38BDF8">GoogleGemini</tspan><tspan fill="#F8FAFC">({</tspan>
        </text>

        <!-- Line 6 -->
        <text x="24" y="124">
          <tspan fill="#E2E8F0">model:</tspan> <tspan fill="#34D399">'gemini-2.5-pro'</tspan><tspan fill="#F8FAFC">,</tspan> <tspan fill="#E2E8F0">temperature:</tspan> <tspan fill="#F59E0B">0.2</tspan>
        </text>

        <!-- Line 7 -->
        <text x="12" y="144">
          <tspan fill="#F8FAFC">});</tspan>
        </text>

        <!-- Line 8 (Active Line with Cursor) -->
        <text x="12" y="164">
          <tspan fill="#F43F5E">const</tspan> <tspan fill="#F8FAFC">pipeline</tspan> <tspan fill="#F43F5E">=</tspan> <tspan fill="#F43F5E">await</tspan> <tspan fill="#F8FAFC">ai.</tspan><tspan fill="#38BDF8">streamInference</tspan><tspan fill="#F8FAFC">(req.data);</tspan>
        </text>
        <!-- Blinking Code Cursor -->
        <line x1="282" y1="152" x2="282" y2="167" stroke="#22D3EE" stroke-width="2" class="cursor-blink" />

        <!-- Line 9 -->
        <text x="12" y="184">
          <tspan fill="#818CF8">return</tspan> <tspan fill="#F8FAFC">{</tspan>
        </text>

        <!-- Line 10 -->
        <text x="24" y="204">
          <tspan fill="#E2E8F0">status:</tspan> <tspan fill="#34D399">'READY_TO_DEPLOY'</tspan><tspan fill="#F8FAFC">,</tspan>
        </text>

        <!-- Line 11 -->
        <text x="24" y="224">
          <tspan fill="#E2E8F0">latency:</tspan> <tspan fill="#F59E0B">12</tspan><tspan fill="#F8FAFC">,</tspan> <tspan fill="#E2E8F0">unit:</tspan> <tspan fill="#34D399">'ms'</tspan><tspan fill="#F8FAFC">,</tspan>
        </text>

        <!-- Line 12 -->
        <text x="24" y="244">
          <tspan fill="#E2E8F0">stream:</tspan> <tspan fill="#F8FAFC">pipeline.</tspan><tspan fill="#38BDF8">iterator</tspan><tspan fill="#F8FAFC">()</tspan>
        </text>

        <!-- Line 13 -->
        <text x="12" y="264">
          <tspan fill="#F8FAFC">};</tspan>
        </text>

        <!-- Line 14 -->
        <text x="0" y="284">
          <tspan fill="#F8FAFC">}</tspan>
        </text>

        <!-- Line 15 (Comment) -->
        <text x="0" y="304" fill="#64748B">
          // Sentinel Grid &amp; CRM Synchronization Active
        </text>

        <!-- Line 16 -->
        <text x="0" y="324">
          <tspan fill="#818CF8">export default</tspan> <tspan fill="#38BDF8">orchestrateSystem</tspan><tspan fill="#F8FAFC">;</tspan>
        </text>
      </g>
    </g>

    <!-- RIGHT SPLIT PANE: INTEGRATED TERMINAL & TELEMETRY -->
    <g transform="translate(530, 62)">
