      <path d="M 140 0 L 140 366" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

      <!-- Explorer Header -->
      <text x="14" y="20" class="text-code" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1.5">EXPLORER</text>

