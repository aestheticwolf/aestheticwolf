<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Lighting Gradients -->
    <radialGradient id="deskGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Laptop Rim Gradients -->
    <linearGradient id="chassisBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3F58" />
      <stop offset="25%" stop-color="#1E2235" />
      <stop offset="50%" stop-color="#4B5578" />
      <stop offset="75%" stop-color="#151824" />
      <stop offset="100%" stop-color="#282D42" />
    </linearGradient>

    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090B12" />
    </linearGradient>

    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222638" />
      <stop offset="20%" stop-color="#181B29" />
      <stop offset="80%" stop-color="#12141F" />
      <stop offset="100%" stop-color="#0B0D14" />
    </linearGradient>

    <linearGradient id="deckLipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1E2E" />
      <stop offset="40%" stop-color="#4B5578" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#4B5578" />
      <stop offset="100%" stop-color="#1A1E2E" />
    </linearGradient>

    <linearGradient id="screenGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Floating Badge Gradients -->
    <linearGradient id="glassPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161A2B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0C0E17" stop-opacity="0.95" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes floatPillA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatPillB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulseSignal {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.95; }
      }
      @keyframes lineGlow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      @keyframes waveScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }

      .text-code {
        font-family: "JetBrains Mono", "Fira Code", Monaco, Consolas, "Courier New", monospace;
        font-size: 11px;
      }
      .text-ui {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .cursor-blink {
        animation: blinkCursor 0.85s infinite;
      }
      .floating-a {
        animation: floatPillA 4.5s ease-in-out infinite;
      }
      .floating-b {
        animation: floatPillB 5s ease-in-out infinite;
      }
      .signal-ping {
        animation: pulseSignal 2s infinite ease-in-out;
      }
      .wave-anim {
        animation: waveScroll 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Ambient Environment Glow behind Laptop -->
  <ellipse cx="500" cy="520" rx="460" ry="90" fill="url(#deskGlow)" />

  <!-- 3D FLOATING HUD WIDGETS -->
  <!-- Left Floating Widget: Tech Core -->
  <g transform="translate(40, 95)" class="floating-a">
    <rect width="180" height="64" rx="12" fill="url(#glassPillGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.2" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))" />
    <path d="M 0 0 L 180 0" stroke="url(#activeTabGrad)" stroke-width="2" rx="1" />
    <circle cx="20" cy="24" r="5" fill="#8B5CF6" />
    <circle cx="20" cy="24" r="9" fill="#8B5CF6" class="signal-ping" />
    <text x="34" y="27" class="text-code" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="1">FULL-STACK ENGINE</text>
    <text x="20" y="48" class="text-code" font-size="9" fill="#A1A1AA">React 19 • Node • TS 5.9</text>
  </g>

  <!-- Right Floating Widget: AI Pipeline -->
  <g transform="translate(775, 75)" class="floating-b">
    <rect width="185" height="64" rx="12" fill="url(#glassPillGrad)" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.2" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))" />
    <path d="M 0 0 L 185 0" stroke="url(#activeTabGrad)" stroke-width="2" rx="1" />
    <circle cx="20" cy="24" r="5" fill="#22D3EE" />
    <circle cx="20" cy="24" r="9" fill="#22D3EE" class="signal-ping" />
    <text x="34" y="27" class="text-code" font-size="10" font-weight="700" fill="#22D3EE" letter-spacing="1">GEMINI AI INTEGRATION</text>
    <text x="20" y="48" class="text-code" font-size="9" fill="#A1A1AA">Latency: 14ms • RAG Active</text>
  </g>

  <!-- LAPTOP SCREEN ENCLOSURE (UPPER LID) -->
  <!-- Outer metallic display bezel edge -->
  <rect x="115" y="35" width="770" height="475" rx="18" fill="url(#bezelGrad)" stroke="url(#chassisBorder)" stroke-width="2" />

  <!-- Inner Display Frame -->
  <rect x="125" y="45" width="750" height="455" rx="12" fill="#08090D" />

  <!-- WebCam & Ambient Light Sensor Notch -->
  <circle cx="500" cy="53" r="3.5" fill="#1C1F2E" stroke="#2B3145" stroke-width="0.8" />
  <circle cx="500" cy="53" r="1.5" fill="#0D111A" />
  <circle cx="515" cy="53" r="1.2" fill="#22D3EE" opacity="0.6" />

  <!-- ==================== DISPLAY INNER WORKSPACE ==================== -->
  <g transform="translate(135, 62)">
    <!-- IDE Workspace Background -->
    <rect width="730" height="428" rx="8" fill="#0A0C14" />

    <!-- Window Top Header Bar -->
    <rect width="730" height="34" rx="8" fill="#101320" />
    <path d="M 0 34 L 730 34" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

    <!-- macOS Traffic Light Window Buttons -->
    <circle cx="20" cy="17" r="5" fill="#EF4444" />
    <circle cx="36" cy="17" r="5" fill="#F59E0B" />
    <circle cx="52" cy="17" r="5" fill="#10B981" />

    <!-- Breadcrumb Path in Window Titlebar -->
    <text x="225" y="21" class="text-code" font-size="10.5" fill="#94A3B8" letter-spacing="0.8">
      aestheticwolf <tspan fill="#64748B">/</tspan> workspace <tspan fill="#64748B">/</tspan> src <tspan fill="#64748B">/</tspan> <tspan fill="#E2E8F0" font-weight="700">IntelligenceEngine.tsx</tspan>
    </text>

    <!-- Top Right Status Mini Indicators -->
    <g transform="translate(640, 10)">
      <rect width="75" height="15" rx="4" fill="#181D2E" />
      <circle cx="9" cy="7.5" r="3" fill="#10B981" />
      <text x="18" y="11" class="text-code" font-size="8.5" fill="#10B981">LIVE SYNC</text>
    </g>

    <!-- IDE Tab Strip Bar -->
    <g transform="translate(0, 34)">
      <rect width="730" height="28" fill="#0D101C" />
      <path d="M 0 28 L 730 28" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

      <!-- Active Tab: IntelligenceEngine.tsx -->
      <rect x="140" y="0" width="165" height="28" fill="#121524" />
      <path d="M 140 27 L 305 27" stroke="url(#activeTabGrad)" stroke-width="2.5" />
      <text x="152" y="18" class="text-code" font-size="10" font-weight="700" fill="#67E8F9">⚛ IntelligenceEngine.tsx</text>

      <!-- Inactive Tab 2: NeuralAgent.py -->
      <rect x="306" y="0" width="135" height="28" fill="#0D101C" />
      <text x="320" y="18" class="text-code" font-size="10" fill="#64748B">🐍 NeuralAgent.py</text>

