        <path d="M 0 0 L 200 0" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
        
        <text x="10" y="18" class="text-code" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1">SYSTEM TELEMETRY</text>

        <!-- Metric 1: CPU -->
