          <path d="M 0 29 L 256 29" stroke="#1E263E" stroke-width="1" stroke-dasharray="2 2" />
          <path d="M 5 29 Q 32 6, 60 29 T 120 29 T 180 29 T 240 29 T 256 29" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="10 5" class="wave-loop" />
          <text x="8" y="50" class="t-mono" font-size="7.5" fill="#22D3EE">LATENCY: 12ms // 60 FPS // ZERO JITTER</text>
        </g>

        <!-- Diagnostics Metrics -->
        <g transform="translate(12, 98)" class="t-mono" font-size="8.5">
          <text x="0" y="12" fill="#94A3B8">CPU: 14%</text>
          <rect x="54" y="4" width="70" height="5" rx="2.5" fill="#181E32" />
          <rect x="54" y="4" width="22" height="5" rx="2.5" fill="#22D3EE" />

          <text x="140" y="12" fill="#94A3B8">RAM: 4.2GB</text>
          <rect x="198" y="4" width="70" height="5" rx="2.5" fill="#181E32" />
          <rect x="198" y="4" width="38" height="5" rx="2.5" fill="#8B5CF6" />

          <!-- Bottom Status Chips -->
          <g transform="translate(0, 22)">
            <rect width="124" height="20" rx="4" fill="#151A2E" stroke="rgba(139, 92, 246, 0.3)" />
            <text x="12" y="14" font-size="8" fill="#C4B5FD">SECURITY: JWT OK</text>

            <rect x="132" y="0" width="124" height="20" rx="4" fill="#151A2E" stroke="rgba(34, 211, 238, 0.3)" />
