        <rect width="280" height="162" fill="#0A0C14" />
        <path d="M 0 0 L 280 0" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
        
        <text x="12" y="18" class="t-mono" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1">SYSTEM TELEMETRY</text>

