<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <!-- Lighting Gradients -->
    <radialGradient id="lapFloorGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Rim Gradients -->
    <linearGradient id="lapChassisBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3F58" />
      <stop offset="30%" stop-color="#1E2235" />
      <stop offset="50%" stop-color="#4B5578" />
      <stop offset="70%" stop-color="#151824" />
      <stop offset="100%" stop-color="#282D42" />
    </linearGradient>

    <linearGradient id="lapDeckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222638" />
      <stop offset="25%" stop-color="#181B29" />
      <stop offset="80%" stop-color="#12141F" />
      <stop offset="100%" stop-color="#0B0D14" />
    </linearGradient>

    <linearGradient id="lapDeckLip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1E2E" />
      <stop offset="45%" stop-color="#4B5578" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#4B5578" />
      <stop offset="100%" stop-color="#1A1E2E" />
    </linearGradient>

    <linearGradient id="lapTabActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="lapGlassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes waveSlide {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -36; }
      }
      @keyframes pulsePill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .t-mono {
        font-family: "JetBrains Mono", "Fira Code", Monaco, Consolas, monospace;
      }
      .c-blink {
        animation: blinkCursor 0.85s infinite;
      }
      .wave-loop {
        animation: waveSlide 2s linear infinite;
      }
      .float-w1 {
        animation: pulsePill 4s ease-in-out infinite;
      }
      .float-w2 {
        animation: pulsePill 4.8s ease-in-out infinite reverse;
      }
    </style>
  </defs>

  <!-- Ambient Floor Lighting -->
  <ellipse cx="500" cy="535" rx="460" ry="85" fill="url(#lapFloorGlow)" />

  <!-- Minimal Floating HUD Chips -->
  <g transform="translate(36, 110)" class="float-w1">
    <rect width="180" height="52" rx="10" fill="#121524" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.2" />
    <path d="M 0 0 L 180 0" stroke="url(#lapTabActive)" stroke-width="2" />
    <circle cx="18" cy="22" r="4.5" fill="#8B5CF6" />
    <text x="30" y="25" class="t-mono" font-size="9.5" font-weight="700" fill="#FFFFFF" letter-spacing="1">FULL-STACK WORKSPACE</text>
    <text x="18" y="42" class="t-mono" font-size="8.5" fill="#A1A1AA">React 19 • Node • TS 5.9</text>
  </g>

  <g transform="translate(784, 90)" class="float-w2">
    <rect width="180" height="52" rx="10" fill="#121524" stroke="rgba(34, 211, 238, 0.35)" stroke-width="1.2" />
    <path d="M 0 0 L 180 0" stroke="url(#lapTabActive)" stroke-width="2" />
    <circle cx="18" cy="22" r="4.5" fill="#22D3EE" />
    <text x="30" y="25" class="t-mono" font-size="9.5" font-weight="700" fill="#22D3EE" letter-spacing="1">APPLIED AI PIPELINE</text>
    <text x="18" y="42" class="t-mono" font-size="8.5" fill="#A1A1AA">Gemini 2.5 • RAG • 12ms</text>
  </g>

  <!-- LAPTOP SCREEN ENCLOSURE (UPPER LID) -->
  <rect x="105" y="32" width="790" height="486" rx="18" fill="#121522" stroke="url(#lapChassisBorder)" stroke-width="2" />
  <!-- Inner Display Frame Bezel -->
  <rect x="115" y="42" width="770" height="466" rx="11" fill="#08090D" />

  <!-- WebCam Notch & Indicator Sensor -->
  <circle cx="500" cy="50" r="3.2" fill="#1A1E2C" stroke="#2B3145" stroke-width="0.8" />
  <circle cx="500" cy="50" r="1.3" fill="#08090D" />
  <circle cx="513" cy="50" r="1.2" fill="#10B981" opacity="0.8" />

  <!-- ==================== DISPLAY INNER WORKSPACE ==================== -->
  <g transform="translate(125, 58)">
    <!-- IDE Canvas Background -->
    <rect width="750" height="440" rx="8" fill="#0A0C14" />

    <!-- Top Titlebar -->
    <rect width="750" height="32" rx="8" fill="#101320" />
    <path d="M 0 32 L 750 32" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

    <!-- macOS Traffic Light Window Buttons -->
    <circle cx="18" cy="16" r="4.8" fill="#EF4444" />
    <circle cx="34" cy="16" r="4.8" fill="#F59E0B" />
    <circle cx="50" cy="16" r="4.8" fill="#10B981" />

    <!-- Title Breadcrumb -->
    <text x="210" y="20" class="t-mono" font-size="10.5" fill="#94A3B8" letter-spacing="0.5">
      aestheticwolf <tspan fill="#64748B">/</tspan> workspace <tspan fill="#64748B">/</tspan> <tspan fill="#E2E8F0" font-weight="700">FullStackApp.tsx</tspan>
    </text>

    <!-- Branch Indicator -->
    <g transform="translate(645, 9)">
      <rect width="92" height="15" rx="3.5" fill="#181D2E" />
      <circle cx="9" cy="7.5" r="2.8" fill="#10B981" />
      <text x="17" y="11" class="t-mono" font-size="8.5" font-weight="600" fill="#10B981">main • synced</text>
    </g>

    <!-- Tab Bar -->
    <g transform="translate(0, 32)">
      <rect width="750" height="26" fill="#0D101C" />
      <path d="M 0 26 L 750 26" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

      <!-- Active Tab: FullStackApp.tsx -->
      <rect x="135" y="0" width="155" height="26" fill="#121524" />
      <path d="M 135 25 L 290 25" stroke="url(#lapTabActive)" stroke-width="2" />
      <text x="146" y="17" class="t-mono" font-size="9.5" font-weight="700" fill="#67E8F9">⚛ FullStackApp.tsx</text>

      <!-- Inactive Tab 2: orchestrate.py -->
      <rect x="291" y="0" width="130" height="26" fill="#0D101C" />
      <text x="303" y="17" class="t-mono" font-size="9.5" fill="#64748B">🐍 orchestrate.py</text>

      <!-- Inactive Tab 3: schema.prisma -->
      <rect x="422" y="0" width="125" height="26" fill="#0D101C" />
      <text x="434" y="17" class="t-mono" font-size="9.5" fill="#64748B">◬ schema.prisma</text>
    </g>

    <!-- LEFT FILE EXPLORER SIDEBAR -->
    <g transform="translate(0, 58)">
      <rect width="135" height="382" fill="#0D0F19" />
      <path d="M 135 0 L 135 382" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

      <text x="12" y="18" class="t-mono" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1.5">WORKSPACE</text>

      <g transform="translate(12, 34)" class="t-mono" font-size="9">
        <text x="0" y="0" fill="#94A3B8">▾ src</text>
        <text x="10" y="16" fill="#64748B">▸ api</text>
        <text x="10" y="32" fill="#64748B">▸ components</text>
        
        <text x="10" y="48" fill="#94A3B8">▾ intelligence</text>
        <text x="20" y="64" fill="#22D3EE">• gemini.ts</text>
        <text x="20" y="80" fill="#A78BFA">• whisper.py</text>
        
        <text x="10" y="98" fill="#94A3B8">▾ database</text>
        <text x="20" y="114" fill="#38BDF8">• prisma.db</text>

        <text x="10" y="132" fill="#F472B6">⚛ App.tsx</text>
        <text x="10" y="148" fill="#F59E0B">⚡ server.ts</text>
        <text x="10" y="164" fill="#64748B">⚙ config.json</text>
      </g>
    </g>

