      <rect x="31" y="130" width="300" height="19" fill="#141829" opacity="0.85" />
      <path d="M 31 130 L 31 149" stroke="#8B5CF6" stroke-width="2" />

      <!-- Syntax-Highlighted Code -->
      <g transform="translate(42, 0)" class="t-mono" font-size="10">
        <text x="0" y="22">
          <tspan fill="#F43F5E">import</tspan> <tspan fill="#F8FAFC">{ GoogleGemini, RAG }</tspan> <tspan fill="#F43F5E">from</tspan> <tspan fill="#34D399">'@ai/core'</tspan><tspan fill="#F8FAFC">;</tspan>
        </text>
        <text x="0" y="42">
          <tspan fill="#F43F5E">import</tspan> <tspan fill="#F8FAFC">{ PrismaClient }</tspan> <tspan fill="#F43F5E">from</tspan> <tspan fill="#34D399">'@prisma/client'</tspan><tspan fill="#F8FAFC">;</tspan>
        </text>
        <text x="0" y="62" fill="#64748B">
          // Architect: Richard D'Souza (Full-Stack Engineer)
        </text>
        <text x="0" y="82">
          <tspan fill="#818CF8">export async function</tspan> <tspan fill="#38BDF8">runEngine</tspan><tspan fill="#F8FAFC">(req: DevRequest) {</tspan>
        </text>
        <text x="12" y="102">
          <tspan fill="#F43F5E">const</tspan> <tspan fill="#F8FAFC">ai</tspan> <tspan fill="#F43F5E">=</tspan> <tspan fill="#818CF8">new</tspan> <tspan fill="#38BDF8">GoogleGemini</tspan><tspan fill="#F8FAFC">({</tspan>
        </text>
        <text x="24" y="122">
          <tspan fill="#E2E8F0">model:</tspan> <tspan fill="#34D399">'gemini-2.5-pro'</tspan><tspan fill="#F8FAFC">,</tspan> <tspan fill="#E2E8F0">temp:</tspan> <tspan fill="#F59E0B">0.2</tspan>
        </text>
        <text x="12" y="142">
          <tspan fill="#F43F5E">const</tspan> <tspan fill="#F8FAFC">res</tspan> <tspan fill="#F43F5E">=</tspan> <tspan fill="#F43F5E">await</tspan> <tspan fill="#F8FAFC">ai.</tspan><tspan fill="#38BDF8">streamInference</tspan><tspan fill="#F8FAFC">(req.data);</tspan>
        </text>
        <!-- Blinking Code Cursor -->
        <line x1="255" y1="132" x2="255" y2="146" stroke="#22D3EE" stroke-width="2" class="c-blink" />

        <text x="12" y="162">
          <tspan fill="#818CF8">return</tspan> <tspan fill="#F8FAFC">{</tspan>
        </text>
        <text x="24" y="182">
          <tspan fill="#E2E8F0">status:</tspan> <tspan fill="#34D399">'READY_TO_DEPLOY'</tspan><tspan fill="#F8FAFC">,</tspan>
        </text>
        <text x="24" y="202">
          <tspan fill="#E2E8F0">latency:</tspan> <tspan fill="#F59E0B">12</tspan><tspan fill="#F8FAFC">,</tspan> <tspan fill="#E2E8F0">unit:</tspan> <tspan fill="#34D399">'ms'</tspan>
        </text>
        <text x="12" y="222">
          <tspan fill="#F8FAFC">};</tspan>
        </text>
        <text x="0" y="242">
          <tspan fill="#F8FAFC">}</tspan>
        </text>
        <text x="0" y="262" fill="#64748B">
          // Verified: Sentinel &amp; CRM Sync Online
        </text>
        <text x="0" y="282">
          <tspan fill="#818CF8">export default</tspan> <tspan fill="#38BDF8">runEngine</tspan><tspan fill="#F8FAFC">;</tspan>
        </text>
      </g>
    </g>

    <!-- RIGHT/BOTTOM INTEGRATED TERMINAL & TELEMETRY PANEL -->
    <g transform="translate(470, 58)">
      <rect width="280" height="382" fill="#0C0E18" />
      <path d="M 0 0 L 0 382" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

      <!-- Terminal Top Header -->
      <rect width="280" height="24" fill="#141829" />
      <path d="M 0 24 L 280 24" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <text x="12" y="16" class="t-mono" font-size="9" font-weight="700" fill="#38BDF8">TERMINAL: zsh (richard@github)</text>

      <!-- Terminal Interactive Session Output -->
      <g transform="translate(12, 38)" class="t-mono" font-size="9">
        <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github:~$ <tspan fill="#F5F5F7">whoami</tspan></text>
        <text x="0" y="14" fill="#8B5CF6">↳ <tspan fill="#FFFFFF" font-weight="700">Richard D'Souza</tspan></text>

        <text x="0" y="32" font-weight="700" fill="#22D3EE">richard@github:~$ <tspan fill="#F5F5F7">role</tspan></text>
        <text x="0" y="46" fill="#8B5CF6">↳ <tspan fill="#38BDF8" font-weight="700">Software Engineer | Full-Stack</tspan></text>

        <text x="0" y="64" font-weight="700" fill="#22D3EE">richard@github:~$ <tspan fill="#F5F5F7">tech --stack</tspan></text>
        <text x="0" y="78" fill="#8B5CF6">↳ <tspan fill="#C4B5FD">React • Node • Python • C# • TS</tspan></text>

        <text x="0" y="96" font-weight="700" fill="#22D3EE">richard@github:~$ <tspan fill="#F5F5F7">build --production</tspan></text>
        <text x="0" y="110" fill="#34D399">✓ 48 modules optimized [180ms]</text>
        <text x="0" y="124" fill="#22D3EE">⚡ API: port 8080 online</text>
        <text x="0" y="138" fill="#F1F5F9">● Status: 200 OK • Memory: 42MB</text>

        <!-- Active Terminal Prompt with Blinking Block Cursor -->
        <text x="0" y="162" font-weight="700" fill="#22D3EE">richard@github:~$ <tspan fill="#34D399">ready</tspan></text>
        <rect x="135" y="152" width="6" height="12" fill="#22D3EE" class="c-blink" />
      </g>

      <!-- Sub-panel: Oscilloscope System Telemetry -->
