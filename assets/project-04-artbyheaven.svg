<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161226" />
      <stop offset="100%" stop-color="#0A0814" />
    </linearGradient>
    <linearGradient id="artAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="artGlow" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0A0814" stop-opacity="0" />
    </radialGradient>
    <style>
      .f-code { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .f-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#artBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect width="500" height="320" rx="12" fill="url(#artGlow)" />
  <path d="M 0 0 L 500 0" stroke="url(#artAccent)" stroke-width="2.5" rx="1" />

  <!-- Header -->
  <rect x="0" y="0" width="500" height="32" rx="12" fill="#18142C" />
  <circle cx="20" cy="16" r="4.5" fill="#EF4444" />
  <circle cx="34" cy="16" r="4.5" fill="#F59E0B" />
  <circle cx="48" cy="16" r="4.5" fill="#10B981" />
  <text x="70" y="20" class="f-code" font-size="9.5" fill="#94A3B8">Art by Heaven • React Native + Razorpay Gateway</text>

  <!-- Left Product Storefront Mockup Card -->
  <g transform="translate(24, 48)">
    <rect width="180" height="210" rx="12" fill="#0E0C1C" stroke="rgba(139,92,246,0.3)" stroke-width="1" />
    
    <!-- Artwork Image Preview Box -->
    <rect x="12" y="12" width="156" height="96" rx="8" fill="#1A1530" />
    <!-- Stylized Abstract Handmade Art Canvas -->
    <circle cx="90" cy="60" r="34" fill="#3B82F6" opacity="0.3" />
    <polygon points="50,80 90,30 130,80" fill="#8B5CF6" opacity="0.5" />
    <polygon points="75,80 105,45 135,80" fill="#EC4899" opacity="0.4" />
    <circle cx="115" cy="40" r="12" fill="#F59E0B" opacity="0.7" />

    <!-- In-App Product Meta -->
    <text x="14" y="126" class="f-ui" font-size="10.5" font-weight="800" fill="#FFFFFF">Aurora Canvas Art</text>
    <text x="14" y="140" class="f-code" font-size="8" fill="#F472B6">Handmade • Bespoke Décor</text>
    
    <text x="14" y="162" class="f-ui" font-size="13" font-weight="800" fill="#38BDF8">₹2,499</text>
    <rect x="94" y="148" width="74" height="20" rx="4" fill="#8B5CF6" />
    <text x="105" y="162" class="f-ui" font-size="8.5" font-weight="700" fill="#FFFFFF">ADD TO CART</text>

    <!-- Bottom Stock Sync -->
    <g transform="translate(14, 186)">
      <circle cx="4" cy="4" r="3" fill="#10B981" />
      <text x="12" y="7" class="f-code" font-size="7" fill="#94A3B8">Firestore: Live In Stock</text>
    </g>
  </g>

  <!-- Right Architecture & Feature Breakdown -->
  <g transform="translate(224, 52)">
    <text x="0" y="16" class="f-code" font-size="9" font-weight="700" fill="#EC4899">MOBILE STOREFRONT • FINTECH</text>
    <text x="0" y="38" class="f-ui" font-size="14" font-weight="800" fill="#FFFFFF">High-Conversion Art Store</text>
    <text x="0" y="58" class="f-ui" font-size="10.5" fill="#94A3B8">Engineered with React Native &amp; Expo for smooth</text>
    <text x="0" y="74" class="f-ui" font-size="10.5" fill="#94A3B8">product exploration and friction-free payment.</text>

    <!-- 3 Core Feature Items -->
    <g transform="translate(0, 94)">
      <!-- Item 1 -->
      <rect width="252" height="36" rx="6" fill="#120E24" stroke="rgba(255,255,255,0.05)" />
      <circle cx="16" cy="18" r="4" fill="#EC4899" />
      <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">Realtime Firestore Catalog</text>
      <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">Dynamic categories, instant stock updates</text>

      <!-- Item 2 -->
      <g transform="translate(0, 44)">
        <rect width="252" height="36" rx="6" fill="#120E24" stroke="rgba(255,255,255,0.05)" />
        <circle cx="16" cy="18" r="4" fill="#8B5CF6" />
        <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">Cart &amp; Quantity Logic</text>
        <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">Subtotal calculation &amp; client state persistence</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 88)">
        <rect width="252" height="36" rx="6" fill="#120E24" stroke="rgba(255,255,255,0.05)" />
        <circle cx="16" cy="18" r="4" fill="#3B82F6" />
        <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">Razorpay Native Checkout</text>
        <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">Encrypted UPI, Cards &amp; NetBanking workflow</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 274)">
    <text x="0" y="24" class="f-code" font-size="9" fill="#64748B">STACK: REACT NATIVE • EXPO • TYPESCRIPT • FIRESTORE • RAZORPAY</text>
    <text x="452" y="24" class="f-code" font-size="9" font-weight="700" fill="#EC4899" text-anchor="end">VIEW REPO →</text>
  </g>
</svg>