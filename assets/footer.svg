<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" height="100%">
  <defs>
    <linearGradient id="ftLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="ftFloorGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <style>
      .f-mono { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .f-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="130" fill="url(#ftFloorGlow)" />
  <line x1="60" y1="2" x2="940" y2="2" stroke="url(#ftLine)" stroke-width="2" stroke-linecap="round" />

  <!-- Center Monogram Emblem -->
  <g transform="translate(500, 32)">
    <circle cx="0" cy="0" r="14" fill="#101322" stroke="#8B5CF6" stroke-width="1.2" />
    <polygon points="-4,-2 0,-6 4,-2 0,5" fill="#22D3EE" />
  </g>

  <!-- Typography -->
  <g transform="translate(500, 72)" text-anchor="middle">
    <text y="0" class="f-ui" font-size="12.5" font-weight="700" fill="#FFFFFF" letter-spacing="3.5">
      ENGINEERED WITH PASSION &amp; PRECISION // RICHARD D'SOUZA
    </text>
    <text y="22" class="f-mono" font-size="10" fill="#64748B" letter-spacing="1.5">
      2026 DIGITAL WORKSPACE • GOA, INDIA • @AESTHETICWOLF • ALL SYSTEMS OPERATIONAL
    </text>
  </g>
</svg>