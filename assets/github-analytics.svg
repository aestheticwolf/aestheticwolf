<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%">
  <defs>
    <!-- Deep Navy Chassis Background Gradients -->
    <linearGradient id="chassisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1321" />
      <stop offset="60%" stop-color="#101B32" />
      <stop offset="100%" stop-color="#080B14" />
    </linearGradient>

    <radialGradient id="analyticsCyanGlow" cx="20%" cy="50%" r="60%">
      <animate attributeName="cx" values="20%;25%;20%" dur="15s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="analyticsVioletGlow" cx="80%" cy="50%" r="60%">
      <animate attributeName="cx" values="80%;75%;80%" dur="16s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121827" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0A0D15" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="centerCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151D33" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0E1322" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card Borders with Cyan & Violet Highlights -->
    <linearGradient id="cardBorderLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#282E44" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E2337" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="centerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#3B82F6;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#282E44" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.75">
        <animate attributeName="stop-color" values="#8B5CF6;#3B82F6;#22D3EE;#8B5CF6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardBorderRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#282E44" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E2337" stop-opacity="0.4" />
    </linearGradient>

    <!-- Header Divider Gradient with Scanning Light -->
    <linearGradient id="headerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="25%" stop-color="#22D3EE" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="streakRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="numWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F7" />
    </linearGradient>

    <linearGradient id="numVioletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>

    <!-- Metric Progress Bars -->
    <linearGradient id="leftBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="rightBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container Base Background: Deep Navy Chassis with Cyan & Violet Ambient Glows -->
  <rect width="1000" height="240" rx="16" fill="url(#chassisBg)" />
  <rect width="1000" height="240" rx="16" fill="url(#analyticsCyanGlow)" />
  <rect width="1000" height="240" rx="16" fill="url(#analyticsVioletGlow)" />
  <rect width="1000" height="240" rx="16" fill="none" stroke="#282E44" stroke-width="1.2" />

  <!-- ============================================================== -->
  <!-- 01. DASHBOARD TELEMETRY HEADER                                 -->
  <!-- ============================================================== -->
  <g transform="translate(0, 0)">
    <!-- Pulsing Live Telemetry Indicator -->
    <circle cx="28" cy="22" r="4" fill="#10B981" />
    <circle cx="28" cy="22" r="7" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
    
    <text x="44" y="26" class="mono" font-size="11" font-weight="700" fill="#22D3EE">CONTRIBUTION ACTIVITY</text>
    <text x="204" y="26" class="sans" font-size="11" fill="#4B5563">•</text>
    <text x="218" y="26" class="mono" font-size="10.5" font-weight="600" fill="#A1A1AA">COMMIT CADENCE</text>

    <!-- Right Header Telemetry -->
    <text x="975" y="26" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#8B5CF6">ACTIVITY OVERVIEW // 2026</text>

    <!-- Header Divider Line with Animated Subtle Scan -->
    <rect x="20" y="38" width="960" height="1" fill="url(#headerLineGrad)" />
    <rect x="20" y="38" width="120" height="1" fill="#22D3EE" opacity="0.8">
      <animate attributeName="x" values="20;860;20" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="10s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ============================================================== -->
  <!-- 02. ROW 2: THREE METRIC PANELS                                 -->
  <!-- ============================================================== -->

  <!-- ========================================== -->
  <!-- CARD 1: TOTAL CONTRIBUTIONS (LEFT)         -->
  <!-- ========================================== -->
  <g transform="translate(20, 50)" filter="url(#cardShadow)">
    <!-- Card Base -->
    <rect x="0" y="0" width="305" height="174" rx="14" fill="url(#cardBg)" stroke="url(#cardBorderLeft)" stroke-width="1.2" />

    <!-- Card Header Tag -->
    <rect x="18" y="18" width="28" height="28" rx="8" fill="#151D33" stroke="#283252" stroke-width="1" />
    <!-- Git Commit Icon -->
    <g transform="translate(24, 24)" stroke="#22D3EE" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle cx="8" cy="8" r="3.5" />
      <line x1="1" y1="8" x2="4.5" y2="8" />
      <line x1="11.5" y1="8" x2="15" y2="8" />
    </g>

    <text x="56" y="30" class="mono" font-size="10.5" font-weight="700" fill="#A1A1AA" letter-spacing="1">LIFETIME COMMITS</text>
    <text x="56" y="44" class="sans" font-size="11" font-weight="500" fill="#64748B">All-time tracked activity</text>

    <!-- Primary Big Number -->
    <text x="18" y="108" class="sans" font-size="44" font-weight="800" fill="url(#numWhiteGrad)">315</text>
    <text x="110" y="108" class="mono" font-size="12" font-weight="700" fill="#22D3EE">COMMITS</text>

    <!-- Mini Progress Bar / Visual Density Bar -->
    <rect x="18" y="124" width="269" height="4" rx="2" fill="#151A29" />
    <rect x="18" y="124" width="210" height="4" rx="2" fill="url(#leftBarGrad)">
      <animate attributeName="width" values="180;230;180" dur="8s" repeatCount="indefinite" />
    </rect>

    <!-- Date Range Subtitle -->
    <text x="18" y="148" class="mono" font-size="10" font-weight="500" fill="#8B949E">Mar 28, 2025 - Present</text>
  </g>

  <!-- ========================================== -->
  <!-- CARD 2: CURRENT STREAK (CENTER HIGHLIGHT)  -->
  <!-- ========================================== -->
  <g transform="translate(345, 50)" filter="url(#cardShadow)">
    <!-- Center Hero Card Base -->
    <rect x="0" y="0" width="310" height="174" rx="14" fill="url(#centerCardBg)" stroke="url(#centerBorderGrad)" stroke-width="1.4" />

    <!-- Live Radial Indicator in Header -->
    <g transform="translate(18, 18)">
      <rect width="28" height="28" rx="8" fill="#1A1838" stroke="#372C61" stroke-width="1" />
      <!-- Fire / Lightning Icon -->
      <path d="M 14 4 L 7 15 L 13 15 L 12 24 L 21 12 L 15 12 Z" fill="#22D3EE" filter="url(#glowCyan)">
        <animate attributeName="fill" values="#22D3EE;#8B5CF6;#22D3EE" dur="4s" repeatCount="indefinite" />
      </path>
    </g>

    <text x="56" y="30" class="mono" font-size="10.5" font-weight="700" fill="#22D3EE" letter-spacing="1">CURRENT STREAK</text>
    <text x="56" y="44" class="sans" font-size="11" font-weight="500" fill="#8B949E">Daily cadence consistency</text>

    <!-- Center Metric Content -->
    <g transform="translate(18, 108)">
      <text x="0" y="0" class="sans" font-size="44" font-weight="800" fill="url(#numVioletGrad)">0</text>
      <text x="60" y="0" class="mono" font-size="12" font-weight="700" fill="#8B5CF6">DAYS ACTIVE</text>
    </g>

    <!-- Ring Circular Gauge on Right Side -->
    <g transform="translate(245, 96)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#161B2E" stroke-width="4.5" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#streakRingGrad)" stroke-width="4.5" stroke-dasharray="176" stroke-dashoffset="130" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
      </circle>
      <!-- Center Pulsing Core -->
      <circle cx="0" cy="0" r="7" fill="#8B5CF6" opacity="0.8">
        <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Bottom Status Text -->
    <rect x="18" y="124" width="274" height="4" rx="2" fill="#161B2E" />
    <rect x="18" y="124" width="140" height="4" rx="2" fill="url(#centerBorderGrad)" />
    
    <text x="18" y="148" class="mono" font-size="10" font-weight="500" fill="#8B949E">Nov 19</text>
  </g>

  <!-- ========================================== -->
  <!-- CARD 3: LONGEST STREAK (RIGHT)            -->
  <!-- ========================================== -->
  <g transform="translate(675, 50)" filter="url(#cardShadow)">
    <!-- Card Base -->
    <rect x="0" y="0" width="305" height="174" rx="14" fill="url(#cardBg)" stroke="url(#cardBorderRight)" stroke-width="1.2" />

    <!-- Card Header Tag -->
    <rect x="18" y="18" width="28" height="28" rx="8" fill="#1C1838" stroke="#332A5E" stroke-width="1" />
    <!-- Trophy / Award Icon -->
    <g transform="translate(24, 24)" stroke="#8B5CF6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 3 L 12 3 L 12 8 C 12 10.2 10.2 12 8 12 C 5.8 12 4 10.2 4 8 Z" />
      <path d="M 4 5 L 2 5 C 1.5 5 1 5.5 1 6 C 1 7.5 2 8.5 3.5 8.5 L 4 8.5" />
      <path d="M 12 5 L 14 5 C 14.5 5 15 5.5 15 6 C 15 7.5 14 8.5 12.5 8.5 L 12 8.5" />
      <line x1="8" y1="12" x2="8" y2="15" />
      <line x1="5" y1="15" x2="11" y2="15" />
    </g>

    <text x="56" y="30" class="mono" font-size="10.5" font-weight="700" fill="#A1A1AA" letter-spacing="1">LONGEST STREAK</text>
    <text x="56" y="44" class="sans" font-size="11" font-weight="500" fill="#64748B">Historical endurance peak</text>

    <!-- Primary Big Number -->
    <text x="18" y="108" class="sans" font-size="44" font-weight="800" fill="url(#numWhiteGrad)">13</text>
    <text x="95" y="108" class="mono" font-size="12" font-weight="700" fill="#8B5CF6">DAYS PEAK</text>

    <!-- Progress Indicator Bar -->
    <rect x="18" y="124" width="269" height="4" rx="2" fill="#151A29" />
    <rect x="18" y="124" width="245" height="4" rx="2" fill="url(#rightBarGrad)" />

    <!-- Date Range Subtitle -->
    <text x="18" y="148" class="mono" font-size="10" font-weight="500" fill="#8B949E">Feb 1 - Feb 13</text>
  </g>
</svg>
