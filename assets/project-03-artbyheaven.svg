<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="100%">
  <defs>
    <!-- Background Atmospheric Lighting Gradients -->
    <linearGradient id="abh3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B32" />
      <stop offset="50%" stop-color="#0D1321" />
      <stop offset="100%" stop-color="#080B14" />
    </linearGradient>

    <linearGradient id="abh3Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <radialGradient id="abh3Glow" cx="28%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>

    <pattern id="abh3Grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#2D2248" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <filter id="abh3Shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      @keyframes shimmerBar {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -560; }
      }
      .f-code { font-family: "JetBrains Mono", "Fira Code", Monaco, monospace; }
      .f-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .shimmer-line {
        stroke-dasharray: 120 440;
        animation: shimmerBar 5s linear infinite;
      }
    </style>
  </defs>

  <!-- ==================== BASE CONTAINER ==================== -->
  <rect width="560" height="360" rx="14" fill="url(#abh3Bg)" stroke="#2B2044" stroke-width="1.2" />
  <rect width="560" height="360" rx="14" fill="url(#abh3Grid)" />
  <circle cx="150" cy="180" r="220" fill="url(#abh3Glow)" />

  <!-- Animated Top Accent Rim -->
  <path d="M 0 0 L 560 0" stroke="url(#abh3Accent)" stroke-width="3" rx="1" />
  <path d="M 0 0 L 560 0" stroke="#FFFFFF" stroke-width="2" opacity="0.6" class="shimmer-line" />

  <!-- Window Chrome Strip -->
  <rect x="0" y="0" width="560" height="34" rx="14" fill="#16122C" />
  <circle cx="20" cy="17" r="4.5" fill="#EF4444" />
  <circle cx="35" cy="17" r="4.5" fill="#F59E0B" />
  <circle cx="50" cy="17" r="4.5" fill="#10B981" />
  <text x="72" y="21" class="f-code" font-size="9.5" font-weight="700" fill="#DDD6FE">Art by Heaven • Flutter E-Commerce &amp; Razorpay Gateway</text>
  <rect x="466" y="8" width="80" height="18" rx="4" fill="#20153D" stroke="#8B5CF6" stroke-width="0.8" />
  <text x="506" y="20" class="f-code" font-size="8" font-weight="700" fill="#C4B5FD" text-anchor="middle">LIVE APP</text>

  <!-- ==================== LEFT: FLUTTER STOREFRONT MOCKUP ==================== -->
  <g transform="translate(24, 48)" filter="url(#abh3Shadow)">
    <rect width="210" height="294" rx="20" fill="#0A0816" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.4" />
    <rect x="6" y="6" width="198" height="282" rx="16" fill="#0E0C1C" />
    
    <!-- Dynamic Island / Speaker -->
    <rect x="75" y="12" width="60" height="5" rx="2.5" fill="#1D1734" />
    <circle cx="120" cy="14.5" r="1.5" fill="#A78BFA" />

    <!-- Status Bar -->
    <text x="16" y="26" class="f-code" font-size="7.5" font-weight="700" fill="#A1A1AA">09:41</text>
    <text x="194" y="26" class="f-code" font-size="7.5" fill="#A1A1AA" text-anchor="end">5G 100%</text>

    <!-- Header Inside Store -->
    <g transform="translate(14, 36)">
      <text x="0" y="11" class="f-ui" font-size="11.5" font-weight="800" fill="#F5F5F7">Art by Heaven</text>
      <rect x="116" y="-1" width="66" height="15" rx="3.5" fill="#1C1436" stroke="#EC4899" stroke-width="0.6" />
      <text x="149" y="10" class="f-code" font-size="7" font-weight="700" fill="#F472B6" text-anchor="middle">ONLINE</text>
    </g>

    <!-- Featured Artwork Card Inside App -->
    <g transform="translate(14, 58)">
      <rect width="182" height="140" rx="10" fill="#15112A" stroke="#2E2452" stroke-width="0.8" />
      
      <!-- Artwork Visual Preview Canvas -->
      <rect x="10" y="10" width="162" height="74" rx="6" fill="#1C1636" />
      <circle cx="91" cy="47" r="28" fill="#3B82F6" opacity="0.3" />
      <polygon points="55,68 91,24 127,68" fill="#8B5CF6" opacity="0.5" />
      <polygon points="78,68 108,35 138,68" fill="#EC4899" opacity="0.4" />
      <circle cx="118" cy="32" r="10" fill="#F59E0B" opacity="0.75" />

      <!-- Product Meta -->
      <text x="12" y="100" class="f-ui" font-size="10.5" font-weight="800" fill="#F5F5F7">Aurora Canvas Artwork</text>
      <text x="12" y="112" class="f-code" font-size="7" fill="#A1A1AA">Handcrafted Décor • Limited Run</text>
      
      <text x="12" y="128" class="f-ui" font-size="12" font-weight="800" fill="#22D3EE">₹2,499</text>
      <rect x="106" y="116" width="66" height="18" rx="4" fill="#8B5CF6" />
      <text x="139" y="128.5" class="f-ui" font-size="7.5" font-weight="700" fill="#F5F5F7" text-anchor="middle">ADD TO CART</text>
    </g>

    <!-- Bottom Cart & Delivery Pill Inside App -->
    <g transform="translate(14, 208)">
      <rect width="182" height="38" rx="7" fill="#131024" stroke="#251E3E" stroke-width="0.8" />
      <circle cx="14" cy="19" r="4" fill="#10B981" />
      <text x="24" y="17" class="f-ui" font-size="8.5" font-weight="700" fill="#F5F5F7">Firestore Inventory Hydration</text>
      <text x="24" y="27" class="f-code" font-size="7" fill="#34D399">In Stock • Dispatch in 24h</text>
    </g>

    <!-- Phone Bottom Navigation Bar -->
    <g transform="translate(14, 256)">
      <rect width="182" height="24" rx="6" fill="#0C0A18" />
      <circle cx="36" cy="12" r="2.5" fill="#EC4899" />
      <circle cx="76" cy="12" r="2.5" fill="#8B949E" />
      <circle cx="116" cy="12" r="2.5" fill="#8B949E" />
      <circle cx="156" cy="12" r="2.5" fill="#8B949E" />
    </g>
  </g>

  <!-- ==================== RIGHT: FINTECH & CLOUD ARCHITECTURE ==================== -->
  <g transform="translate(254, 52)">
    <!-- Card 1: Razorpay Payment Gateway -->
    <g transform="translate(0, 0)">
      <rect width="282" height="74" rx="8" fill="#131026" stroke="#2C204A" stroke-width="0.8" />
      <line x1="0" y1="4" x2="0" y2="70" stroke="#EC4899" stroke-width="3" stroke-linecap="round" />
      <text x="14" y="20" class="f-code" font-size="8" font-weight="700" fill="#F472B6" letter-spacing="1">RAZORPAY FINTECH GATEWAY</text>
      <text x="14" y="38" class="f-ui" font-size="11.5" font-weight="800" fill="#F5F5F7">Secure Checkout &amp; Webhooks</text>
      <text x="14" y="52" class="f-code" font-size="7.5" fill="#A1A1AA">End-to-end UPI, Cards, NetBanking with instant capture</text>
      <g transform="translate(14, 58)">
        <rect width="112" height="12" rx="2" fill="#1F1338" />
        <text x="4" y="9" class="f-code" font-size="6.5" fill="#F472B6">PCI-DSS COMPLIANT // TLS 1.3</text>
      </g>
    </g>

    <!-- Card 2: Cloud Functions Pipeline -->
    <g transform="translate(0, 84)">
      <rect width="282" height="102" rx="8" fill="#0E0C1C" stroke="#2C204A" stroke-width="0.8" />
      <rect width="282" height="20" rx="8" fill="#171230" />
      <text x="12" y="14" class="f-code" font-size="7.5" font-weight="700" fill="#DDD6FE">FIREBASE CLOUD FUNCTIONS PIPELINE</text>
      
      <g transform="translate(14, 30)">
        <text x="0" y="12" class="f-ui" font-size="10" font-weight="700" fill="#F5F5F7">Event-Driven Order Processing</text>
        <text x="254" y="12" class="f-code" font-size="8" font-weight="700" fill="#10B981" text-anchor="end">AUTOMATED</text>
        
        <rect x="0" y="22" width="254" height="6" rx="3" fill="#1A1532" />
        <rect x="0" y="22" width="250" height="6" rx="3" fill="#A78BFA" />

        <text x="0" y="44" class="f-ui" font-size="10" font-weight="700" fill="#F5F5F7">Atomic Inventory Decrement</text>
        <text x="254" y="44" class="f-code" font-size="8" font-weight="700" fill="#22D3EE" text-anchor="end">TRANSACTIONAL</text>
        
        <rect x="0" y="52" width="254" height="6" rx="3" fill="#1A1532" />
        <rect x="0" y="52" width="242" height="6" rx="3" fill="#22D3EE" />
      </g>
    </g>

    <!-- Card 3: Flutter State & Cart Hydration -->
    <g transform="translate(0, 196)">
      <rect width="282" height="52" rx="8" fill="#131026" stroke="#2C204A" stroke-width="0.8" />
      <g transform="translate(14, 14)">
        <text x="0" y="10" class="f-code" font-size="7" fill="#8B949E">STATE_ENGINE</text>
        <text x="0" y="26" class="f-ui" font-size="11" font-weight="800" fill="#38BDF8">Flutter 3.x</text>
      </g>
      <line x1="88" y1="10" x2="88" y2="42" stroke="#241B3E" stroke-width="1" />
      <g transform="translate(98, 14)">
        <text x="0" y="10" class="f-code" font-size="7" fill="#8B949E">DATABASE</text>
        <text x="0" y="26" class="f-ui" font-size="11" font-weight="800" fill="#F59E0B">Firestore</text>
      </g>
      <line x1="184" y1="10" x2="184" y2="42" stroke="#241B3E" stroke-width="1" />
      <g transform="translate(194, 14)">
        <text x="0" y="10" class="f-code" font-size="7" fill="#8B949E">CHECKOUT</text>
        <text x="0" y="26" class="f-ui" font-size="11" font-weight="800" fill="#EC4899">Razorpay</text>
      </g>
    </g>

    <!-- Bottom Architecture Seal -->
    <g transform="translate(0, 258)">
      <rect width="282" height="26" rx="5" fill="#1C1438" stroke="#4C1D95" stroke-width="0.8" />
      <circle cx="12" cy="13" r="3" fill="#A78BFA" />
      <text x="22" y="16.5" class="f-code" font-size="7.5" font-weight="700" fill="#DDD6FE">FLUTTER • FIREBASE • CLOUD FIRESTORE • FUNCTIONS • RAZORPAY</text>
    </g>
  </g>
</svg>
