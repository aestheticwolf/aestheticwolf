<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E111C" />
      <stop offset="100%" stop-color="#08090E" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="termAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes promptPulse {
        0%, 100% { fill: #22D3EE; }
        50% { fill: #8B5CF6; }
      }
      .font-mono {
        font-family: "JetBrains Mono", "Fira Code", Monaco, Consolas, "Courier New", monospace;
      }
      .cursor {
        animation: blinkCursor 0.8s infinite;
      }
      .prompt-icon {
        animation: promptPulse 4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <rect width="900" height="420" rx="16" fill="url(#termAmbient)" />

  <!-- Terminal Window Outer Container -->
  <rect x="2" y="2" width="896" height="416" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <rect x="2" y="2" width="896" height="38" rx="14" fill="#131726" />
  <path d="M 2 40 L 898 40" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />

  <!-- macOS Window Controls (Traffic Lights) -->
  <circle cx="24" cy="21" r="6" fill="#EF4444" />
  <circle cx="44" cy="21" r="6" fill="#F59E0B" />
  <circle cx="64" cy="21" r="6" fill="#10B981" />

  <!-- Terminal Header Title -->
  <text x="450" y="25" class="font-mono" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    richard@github ~ % (zsh)
  </text>

  <!-- Titlebar Right Metadata -->
  <g transform="translate(730, 25)">
    <circle cx="-10" cy="-4" r="3" fill="#10B981" />
    <text x="0" y="0" class="font-mono" font-size="10" fill="#64748B">SESSION: ACTIVE</text>
  </g>

  <!-- ==================== TERMINAL CONTENTS ==================== -->
  <g transform="translate(32, 70)" class="font-mono" font-size="12.5">

    <!-- Line 1: whoami -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github</text>
      <text x="110" y="0" fill="#64748B">:</text>
      <text x="122" y="0" font-weight="700" fill="#818CF8">~</text>
      <text x="135" y="0" fill="#F5F5F7">$ whoami</text>
      <text x="0" y="22" fill="#8B5CF6">↳</text>
      <text x="24" y="22" font-weight="700" fill="#FFFFFF">Richard D'Souza</text>
    </g>

    <!-- Line 2: role -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github</text>
      <text x="110" y="0" fill="#64748B">:</text>
      <text x="122" y="0" font-weight="700" fill="#818CF8">~</text>
      <text x="135" y="0" fill="#F5F5F7">$ role</text>
      <text x="0" y="22" fill="#8B5CF6">↳</text>
      <text x="24" y="22" font-weight="700" fill="#38BDF8">Software Engineer</text>
      <text x="165" y="22" fill="#64748B">|</text>
      <text x="180" y="22" font-weight="700" fill="#A78BFA">Full-Stack Developer</text>
    </g>

    <!-- Line 3: education -->
    <g transform="translate(0, 104)">
      <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github</text>
      <text x="110" y="0" fill="#64748B">:</text>
      <text x="122" y="0" font-weight="700" fill="#818CF8">~</text>
      <text x="135" y="0" fill="#F5F5F7">$ education</text>
      <text x="0" y="22" fill="#8B5CF6">↳</text>
      <text x="24" y="22" fill="#F1F5F9">M.Sc. Information Technology</text>
      <text x="245" y="22" fill="#94A3B8">• Parvatibai Chowgule College, Goa</text>
    </g>

    <!-- Line 4: technologies -->
    <g transform="translate(0, 156)">
      <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github</text>
      <text x="110" y="0" fill="#64748B">:</text>
      <text x="122" y="0" font-weight="700" fill="#818CF8">~</text>
      <text x="135" y="0" fill="#F5F5F7">$ technologies</text>
      <text x="0" y="22" fill="#8B5CF6">↳</text>
      <text x="24" y="22" fill="#67E8F9">React, React Native, Node.js, Python, C#, TypeScript</text>
    </g>

    <!-- Line 5: interests -->
    <g transform="translate(0, 208)">
      <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github</text>
      <text x="110" y="0" fill="#64748B">:</text>
      <text x="122" y="0" font-weight="700" fill="#818CF8">~</text>
      <text x="135" y="0" fill="#F5F5F7">$ interests</text>
      <text x="0" y="22" fill="#8B5CF6">↳</text>
      <text x="24" y="22" fill="#C4B5FD">AI, Backend Engineering, Mobile Applications</text>
    </g>

    <!-- Line 6: Interactive Prompt with Blinking Cursor -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github</text>
      <text x="110" y="0" fill="#64748B">:</text>
      <text x="122" y="0" font-weight="700" fill="#818CF8">~</text>
      <text x="135" y="0" fill="#F5F5F7">$ status --live</text>
      <text x="0" y="22" fill="#8B5CF6">↳</text>
      <text x="24" y="22" fill="#34D399" font-weight="700">⚡ Available for impactful roles &amp; high-scale engineering</text>
    </g>

    <!-- Active Line -->
    <g transform="translate(0, 312)">
      <text x="0" y="0" font-weight="700" fill="#22D3EE">richard@github</text>
      <text x="110" y="0" fill="#64748B">:</text>
      <text x="122" y="0" font-weight="700" fill="#818CF8">~</text>
      <text x="135" y="0" fill="#F5F5F7">$ </text>
      <!-- Blinking Terminal Block Cursor -->
      <rect x="150" y="-12" width="8" height="15" fill="#22D3EE" class="cursor" />
    </g>
  </g>
</svg>