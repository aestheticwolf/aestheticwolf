<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="100%" fill="none">
  <defs>
    <linearGradient id="lineGrad_04" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#C084FC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .f-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; }
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes pulse_04 {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .beacon_04 {
      transform-origin: 8px 16px;
      animation: pulse_04 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Section Marker: Small Uppercase Label with Glowing Indicator -->
  <g transform="translate(4, 0)">
    <circle cx="8" cy="16" r="3" fill="#C084FC" />
    <circle cx="8" cy="16" r="5.5" fill="none" stroke="#C084FC" stroke-width="1.2" class="beacon_04" />
    <text x="24" y="20" class="f-mono" font-size="11" font-weight="700" fill="#C084FC" letter-spacing="2.2">04 // WORK • SELECTED REPOSITORIES</text>
  </g>

  <!-- Main Section Heading -->
  <text x="4" y="48" class="f-sans" font-size="22" font-weight="800" fill="#F5F5F7" letter-spacing="1.4">SELECTED PROJECTS</text>

  <!-- Decorative Gradient Laser Trace -->
  <line x1="4" y1="56" x2="420" y2="56" stroke="url(#lineGrad_04)" stroke-width="1.5" />

  <!-- Subtitle -->
  <text x="4" y="74" class="f-sans" font-size="13" fill="#94A3B8">
    Featured mobile applications, web platforms, and system implementations.
  </text>
</svg>
