<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="senBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141525" />
      <stop offset="100%" stop-color="#090B12" />
    </linearGradient>
    <linearGradient id="senAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="senRadarGlow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090B12" stop-opacity="0" />
    </radialGradient>
    <style>
      .f-code { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .f-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#senBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect width="500" height="320" rx="12" fill="url(#senRadarGlow)" />
  <path d="M 0 0 L 500 0" stroke="url(#senAccent)" stroke-width="2.5" rx="1" />

  <!-- Header -->
  <rect x="0" y="0" width="500" height="32" rx="12" fill="#15172A" />
  <circle cx="20" cy="16" r="4.5" fill="#EF4444" />
  <circle cx="34" cy="16" r="4.5" fill="#F59E0B" />
  <circle cx="48" cy="16" r="4.5" fill="#10B981" />
  <text x="70" y="20" class="f-code" font-size="9.5" fill="#94A3B8">Sentinel Grid Security SOC • GPS Geofence Active</text>

  <!-- Left Radar & Geofence HUD Visual -->
  <g transform="translate(24, 48)">
    <rect width="190" height="210" rx="12" fill="#0C0E1A" stroke="rgba(34,211,238,0.25)" stroke-width="1" />
    
    <!-- Radar concentric rings -->
    <g transform="translate(95, 95)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#22D3EE" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.3" />
      <circle cx="0" cy="0" r="48" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.4" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.6" />
      <circle cx="0" cy="0" r="3" fill="#22D3EE" />

      <!-- Crosshairs -->
      <line x1="-75" y1="0" x2="75" y2="0" stroke="#22D3EE" stroke-width="0.5" opacity="0.3" />
      <line x1="0" y1="-75" x2="0" y2="75" stroke="#22D3EE" stroke-width="0.5" opacity="0.3" />

      <!-- Verified Guard Beacons -->
      <circle cx="28" cy="-22" r="5" fill="#10B981" />
      <circle cx="28" cy="-22" r="9" fill="none" stroke="#10B981" stroke-width="1" opacity="0.6" />
      <text x="36" y="-18" class="f-code" font-size="7" fill="#10B981">GUARD_04 (OK)</text>

      <circle cx="-32" cy="35" r="4.5" fill="#22D3EE" />
      <text x="-30" y="48" class="f-code" font-size="7" fill="#67E8F9">POST_B (ACTIVE)</text>
    </g>

    <!-- Radar footer chip -->
    <g transform="translate(14, 180)">
      <rect width="162" height="20" rx="4" fill="#131728" />
      <text x="8" y="14" class="f-code" font-size="7.5" fill="#22D3EE">LAT: 15.298° • ACCURACY: ±2M</text>
    </g>
  </g>

  <!-- Right Details & Audit Metrics -->
  <g transform="translate(230, 52)">
    <text x="0" y="16" class="f-code" font-size="9" font-weight="700" fill="#8B5CF6">ENTERPRISE AUDIT DEFENSE</text>
    <text x="0" y="38" class="f-ui" font-size="14" font-weight="800" fill="#FFFFFF">Decentralized Duty Verification</text>
    <text x="0" y="58" class="f-ui" font-size="10.5" fill="#94A3B8">Eliminates ghost shifts with cryptographic</text>
    <text x="0" y="74" class="f-ui" font-size="10.5" fill="#94A3B8">GPS tracking, biometric selfie capture &amp; RBAC.</text>

    <!-- 3 Metrics in Right Column -->
    <g transform="translate(0, 94)">
      <!-- Metric 1 -->
      <rect width="246" height="36" rx="6" fill="#0E111E" stroke="rgba(255,255,255,0.05)" />
      <circle cx="16" cy="18" r="4" fill="#10B981" />
      <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">Selfie Attendance Verification</text>
      <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">Cloudinary media pipeline • Zero spoofing</text>

      <!-- Metric 2 -->
      <g transform="translate(0, 44)">
        <rect width="246" height="36" rx="6" fill="#0E111E" stroke="rgba(255,255,255,0.05)" />
        <circle cx="16" cy="18" r="4" fill="#3B82F6" />
        <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">JWT Role-Based Access (RBAC)</text>
        <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">Admin / Supervisor / Guard separation</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(0, 88)">
        <rect width="246" height="36" rx="6" fill="#0E111E" stroke="rgba(255,255,255,0.05)" />
        <circle cx="16" cy="18" r="4" fill="#8B5CF6" />
        <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">Multi-Site Roster Dispatch</text>
        <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">MongoDB Atlas &amp; Express real-time feeds</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 274)">
    <text x="0" y="24" class="f-code" font-size="9" fill="#64748B">STACK: REACT • NODE.JS • EXPRESS • MONGODB ATLAS • JWT • CLOUDINARY</text>
    <text x="452" y="24" class="f-code" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="end">VIEW REPO →</text>
  </g>
</svg>