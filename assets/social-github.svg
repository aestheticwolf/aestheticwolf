<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" width="100%">
  <defs>
    <!-- Card Chassis: #121827 to #0D1321 -->
    <linearGradient id="cardBg_github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121827" />
      <stop offset="100%" stop-color="#0D1321" />
    </linearGradient>

    <linearGradient id="borderGrad_github" x1="0%" y1="0%" x2="100%" y2="0%">
      
          <stop offset="0%" stop-color="#282E44" />
          <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#282E44" />
        
    </linearGradient>

    <filter id="iconGlow_github" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  ]]></style>

  <!-- Card Chassis -->
  <rect width="310" height="88" rx="12" fill="url(#cardBg_github)" stroke="url(#borderGrad_github)" stroke-width="1.3" />

  <!-- Left Icon Box -->
  <g transform="translate(16, 18)">
    <rect width="52" height="52" rx="10" fill="#080B14" stroke="#282E44" stroke-width="1" />
    <g transform="translate(10, 10) scale(1)">
      
          <!-- GitHub Octocat Mark -->
          <path fill="#22D3EE" d="M16 0C7.16 0 0 7.16 0 16c0 7.08 4.58 13.06 10.94 15.18.8.15 1.1-.34 1.1-.76 0-.38-.02-1.62-.02-2.98-4.44.96-5.38-1.88-5.38-1.88-.72-1.84-1.78-2.34-1.78-2.34-1.46-.98.12-.96.12-.96 1.6.12 2.46 1.64 2.46 1.64 1.42 2.44 3.74 1.74 4.66 1.32.14-1.04.56-1.74 1.02-2.14-3.54-.4-7.26-1.78-7.26-7.9 0-1.74.62-3.18 1.64-4.3-.16-.4-.72-2.04.16-4.24 0 0 1.34-.44 4.4 1.64 1.28-.36 2.66-.54 4.02-.54s2.74.18 4.02.54c3.06-2.08 4.4-1.64 4.4-1.64.88 2.2.32 3.84.16 4.24 1.02 1.12 1.64 2.56 1.64 4.3 0 6.14-3.72 7.5-7.28 7.9.58.5 1.08 1.48 1.08 3 0 2.16-.02 3.9-.02 4.44 0 .42.28.92 1.1.76C27.42 29.06 32 23.08 32 16 32 7.16 24.84 0 16 0z" />
        
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(78, 28)">
    <!-- Metadata Pill -->
    <rect x="0" y="0" width="138" height="15" rx="4" fill="#101B32" />
    <text x="6" y="11" class="mono" font-size="8.5" font-weight="700" fill="#22D3EE" letter-spacing="0.5">30+ REPOSITORIES</text>

    <!-- Network / Username -->
    <text x="0" y="32" class="sans" font-size="14.5" font-weight="700" fill="#F5F5F7">GitHub</text>
    <text x="0" y="47" class="mono" font-size="10.5" font-weight="500" fill="#A1A1AA">@aestheticwolf</text>
  </g>

  <!-- Right Arrow Indicator -->
  <g transform="translate(280, 44)">
    <circle cx="0" cy="0" r="11" fill="#101B32" stroke="#282E44" stroke-width="1" />
    <path d="M -3 -4 L 2 0 L -3 4" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
