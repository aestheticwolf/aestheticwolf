<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="100%" fill="none">
  <defs>
    <linearGradient id="lineGrad_07" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#34D399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <filter id="glow_07" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
    </filter>
  </defs>

  <style>
    .f-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; }
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes pulse_07 {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .beacon_07 {
      transform-origin: 8px 16px;
      animation: pulse_07 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Section Marker: Small Uppercase Label with Glowing Indicator -->
  <g transform="translate(4, 0)">
    <!-- Pulsing Beacon -->
    <circle cx="8" cy="16" r="3" fill="#34D399" />
    <circle cx="8" cy="16" r="5.5" fill="none" stroke="#34D399" stroke-width="1.2" class="beacon_07" />
    <text x="24" y="20" class="f-mono" font-size="11" font-weight="700" fill="#34D399" letter-spacing="2.2">07 // TRAJECTORY • 52-WEEK COMMIT STREAM</text>
  </g>

  <!-- Main Section Heading -->
  <text x="4" y="48" class="f-sans" font-size="22" font-weight="800" fill="#F5F5F7" letter-spacing="1.4">CONTRIBUTION TRAJECTORY</text>

  <!-- Decorative Gradient Laser Trace -->
  <line x1="4" y1="56" x2="420" y2="56" stroke="url(#lineGrad_07)" stroke-width="1.5" />

  <!-- Subtitle with Selective Colored Phrases -->
  <text x="4" y="74" class="f-sans" font-size="13" fill="#94A3B8" font-style="italic">
    "Every contribution represents <tspan fill="#34D399" font-weight="600">another step in my development journey</tspan>."
  </text>
</svg>
