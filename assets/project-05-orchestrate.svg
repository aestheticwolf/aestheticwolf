<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="orcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121724" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <linearGradient id="orcAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="orcGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#080B12" stop-opacity="0" />
    </radialGradient>
    <style>
      .f-code { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .f-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#orcBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect width="500" height="320" rx="12" fill="url(#orcGlow)" />
  <path d="M 0 0 L 500 0" stroke="url(#orcAccent)" stroke-width="2.5" rx="1" />

  <!-- Header -->
  <rect x="0" y="0" width="500" height="32" rx="12" fill="#14192A" />
  <circle cx="20" cy="16" r="4.5" fill="#EF4444" />
  <circle cx="34" cy="16" r="4.5" fill="#F59E0B" />
  <circle cx="48" cy="16" r="4.5" fill="#10B981" />
  <text x="70" y="20" class="f-code" font-size="9.5" fill="#94A3B8">HackerRank Orchestrate • Multi-Modal AI Pipeline</text>

  <!-- Left Pipeline Node Diagram Card -->
  <g transform="translate(24, 48)">
    <rect width="180" height="210" rx="12" fill="#0C0E1A" stroke="rgba(34,211,238,0.25)" stroke-width="1" />
    
    <!-- Step 1: Input -->
    <g transform="translate(14, 18)">
      <rect width="152" height="36" rx="6" fill="#131728" />
      <circle cx="16" cy="18" r="4" fill="#22D3EE" />
      <text x="28" y="16" class="f-ui" font-size="9" font-weight="700" fill="#FFFFFF">WhatsApp &amp; Audio Input</text>
      <text x="28" y="27" class="f-code" font-size="7" fill="#67E8F9">Unstructured media streams</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 90 56 L 90 68" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Step 2: Extraction -->
    <g transform="translate(14, 70)">
      <rect width="152" height="38" rx="6" fill="#131728" />
      <circle cx="16" cy="19" r="4" fill="#3B82F6" />
      <text x="28" y="16" class="f-ui" font-size="9" font-weight="700" fill="#FFFFFF">EasyOCR + Faster Whisper</text>
      <text x="28" y="27" class="f-code" font-size="7" fill="#93C5FD">OCR text • Audio transcription</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 90 110 L 90 122" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Step 3: LLM Inference -->
    <g transform="translate(14, 124)">
      <rect width="152" height="38" rx="6" fill="#131728" stroke="rgba(139,92,246,0.3)" />
      <circle cx="16" cy="19" r="4" fill="#8B5CF6" />
      <text x="28" y="16" class="f-ui" font-size="9" font-weight="700" fill="#FFFFFF">Ollama Policy Auditor</text>
      <text x="28" y="27" class="f-code" font-size="7" fill="#C4B5FD">Context retrieval • Verification</text>
    </g>

    <!-- Verdict Pill -->
    <g transform="translate(14, 174)">
      <rect width="152" height="22" rx="4" fill="#102620" stroke="rgba(16,185,129,0.3)" />
      <text x="14" y="15" class="f-code" font-size="8" font-weight="700" fill="#34D399">DECISION: COMPLETE [OK]</text>
    </g>
  </g>

  <!-- Right Architecture & Feature Breakdown -->
  <g transform="translate(224, 52)">
    <text x="0" y="16" class="f-code" font-size="9" font-weight="700" fill="#22D3EE">HACKATHON • LOCAL AI ENGINE</text>
    <text x="0" y="38" class="f-ui" font-size="14" font-weight="800" fill="#FFFFFF">Autonomous Audit Pipeline</text>
    <text x="0" y="58" class="f-ui" font-size="10.5" fill="#94A3B8">Built for the 24-hr HackerRank Orchestrate hackathon</text>
    <text x="0" y="74" class="f-ui" font-size="10.5" fill="#94A3B8">to correlate evidence across logs, docs &amp; audio.</text>

    <!-- 3 Core Features -->
    <g transform="translate(0, 94)">
      <!-- Item 1 -->
      <rect width="252" height="36" rx="6" fill="#0E121E" stroke="rgba(255,255,255,0.05)" />
      <circle cx="16" cy="18" r="4" fill="#22D3EE" />
      <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">WhatsApp Notification Routing</text>
      <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">Real-time classification of inbound requests</text>

      <!-- Item 2 -->
      <g transform="translate(0, 44)">
        <rect width="252" height="36" rx="6" fill="#0E121E" stroke="rgba(255,255,255,0.05)" />
        <circle cx="16" cy="18" r="4" fill="#3B82F6" />
        <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">Multi-Modal Audio &amp; OCR</text>
        <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">EasyOCR text extraction + Whisper audio notes</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 88)">
        <rect width="252" height="36" rx="6" fill="#0E121E" stroke="rgba(255,255,255,0.05)" />
        <circle cx="16" cy="18" r="4" fill="#8B5CF6" />
        <text x="28" y="16" class="f-ui" font-size="9.5" font-weight="700" fill="#FFFFFF">Local Ollama LLM Reasoning</text>
        <text x="28" y="27" class="f-code" font-size="7.5" fill="#A1A1AA">Ghost data audit &amp; automated evidence checks</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 274)">
    <text x="0" y="24" class="f-code" font-size="9" fill="#64748B">STACK: PYTHON • OLLAMA • EASYOCR • FASTER WHISPER</text>
    <text x="452" y="24" class="f-code" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="end">VIEW REPO →</text>
  </g>
</svg>