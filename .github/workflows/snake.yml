name: generate contribution snake

on:
  schedule:
    - cron: "0 7 * * *"   # regenerates daily at 07:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_snake is the moving snake head/body
          # color_dots is 5 colors: [no contributions -> highest contributions]
          # themed to match the header/footer gradient (navy -> indigo -> cyan/violet)
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#38BDF8&color_dots=#161B22,#172554,#312E81,#2563EB,#22D3EE
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A78BFA&color_dots=#161B22,#172554,#312E81,#2563EB,#22D3EE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}