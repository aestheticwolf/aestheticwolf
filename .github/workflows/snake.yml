name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Generate contribution snake
      # ==========================================

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#06B6D4&color_dots=#0B1220,#164E63,#0369A1,#0891B2,#22D3EE
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A78BFA&color_dots=#0D1117,#172554,#312E81,#4C1D95,#7C3AED

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Deploy generated SVG files
      # ==========================================

      - name: Deploy Snake Animation
        uses: crazy-max/ghaction-github-pages@v4

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}