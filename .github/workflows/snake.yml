name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Generate contribution snake
      # ==========================================

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22D3EE&color_dots=#0B1220,#164E63,#0EA5E9,#6366F1,#A78BFA
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F472B6&color_dots=#0D1117,#1E1B4B,#4338CA,#7C3AED,#EC4899

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Deploy generated SVG files
      # ==========================================

      - name: Deploy Snake Animation
        uses: crazy-max/ghaction-github-pages@v4

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}